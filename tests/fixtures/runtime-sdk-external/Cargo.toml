[package]
name = "talos-runtime-external-fixture"
version = "0.0.0"
edition = "2024"
publish = false

# This manifest is intentionally an independent Cargo root. The path dependencies are the
# explicit local-source mode used by the fixture; no other Talos direct dependency is allowed.
[workspace]

[features]
default = []
coding = ["talos-runtime/shared-composition"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
talos-runtime = { version = "0.10.1", path = "../../../crates/talos-runtime" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
