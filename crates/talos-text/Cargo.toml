[package]
name = "talos-text"
description = "UI-neutral text and language contracts for Talos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
arborium = { version = "2.18", default-features = false, optional = true, features = ["lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-go", "lang-java", "lang-c", "lang-cpp", "lang-c-sharp", "lang-bash", "lang-sql", "lang-powershell", "lang-lua", "lang-dart", "lang-html", "lang-css", "lang-json", "lang-toml", "lang-markdown", "lang-ruby", "lang-php", "lang-kotlin", "lang-swift"] }

[features]
code-intelligence = ["dep:arborium"]

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
