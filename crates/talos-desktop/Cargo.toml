[package]
name = "talos-desktop"
description = "Desktop application host for the Talos Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
desktop-ui = ["dep:gpui", "dep:gpui_platform", "dep:unicode-segmentation"]
visual-test = ["desktop-ui", "gpui_platform/test-support", "gpui/profiler"]

[[bin]]
name = "talos-desktop-mock"
path = "src/main.rs"
required-features = ["desktop-ui"]

[dependencies]
talos-runtime = { version = "0.10.1", path = "../talos-runtime", features = ["shared-composition"] }
talos-sandbox = { version = "0.10.1", path = "../talos-sandbox" }
talos-config = { version = "0.10.1", path = "../talos-config" }
talos-provider = { version = "0.10.1", path = "../talos-provider" }
talos-session = { version = "0.10.1", path = "../talos-session" }
talos-core = { version = "0.10.1", path = "../talos-core" }
talos-plugin = { version = "0.10.1", path = "../talos-plugin" }
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
async-trait = "0.1.92"
serde_json = "1.0.151"
sha2 = "0.11"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
uuid = { version = "1.26.0", features = ["v4"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "ac5af8b9e1ea3f7922fbabefe409c05b8766135c", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ac5af8b9e1ea3f7922fbabefe409c05b8766135c", optional = true, features = ["runtime_shaders", "font-kit", "wayland", "x11"] }
unicode-segmentation = { version = "1.13.3", optional = true }

[dev-dependencies]
