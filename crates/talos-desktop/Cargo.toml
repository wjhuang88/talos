[package]
name = "talos-desktop"
description = "Fixture-backed Desktop visual prototype"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
desktop-ui = ["dep:gpui", "dep:gpui_platform", "dep:unicode-segmentation"]
visual-test = ["desktop-ui", "gpui_platform/test-support", "gpui/profiler"]

[[bin]]
name = "talos-desktop-mock"
path = "src/main.rs"
required-features = ["desktop-ui"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "ac5af8b9e1ea3f7922fbabefe409c05b8766135c", optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ac5af8b9e1ea3f7922fbabefe409c05b8766135c", optional = true, features = ["runtime_shaders", "font-kit", "wayland", "x11"] }
unicode-segmentation = { version = "1.13.3", optional = true }
