[package]
name = "talos-tui"
description = "Terminal user interface for Talos agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
gix = { version = "0.85", default-features = false, features = ["basic", "status", "revision", "blob-diff", "index", "sha1"] }
talos-core = { version = "0.9.0", path = "../talos-core" }
talos-permission = { version = "0.9.0", path = "../talos-permission" }
talos-conversation = { version = "0.9.0", path = "../talos-conversation" }
ratatui = { version = "0.30", features = ["scrolling-regions"] }
unicode-width = "0.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["sync", "macros", "time", "rt"] }
futures = "0.3"
serde_json = "1"
tui-markdown = "0.3"
mermaid-text = "0.56"
talos-text = { version = "0.9.0", path = "../talos-text", features = ["code-intelligence"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
