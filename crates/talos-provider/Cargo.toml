[package]
name = "talos-provider"
description = "LLM client abstractions and provider-specific implementations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
google-cloud-auth = { version = "=1.18.0", default-features = false, features = ["default-rustls-provider"] }
async-trait = "0.1.92"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11"
talos-config = { version = "0.10.1", path = "../talos-config" }
talos-core = { version = "0.10.1", path = "../talos-core" }
thiserror = "2.0.20"
tokio = { version = "1", features = ["sync", "macros"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
# Exercise authenticated native-wire image/tool rounds through the real Agent and read tool.
talos-agent = { version = "0.10.1", path = "../talos-agent" }
talos-permission = { version = "0.10.1", path = "../talos-permission" }
talos-tools = { version = "0.10.1", path = "../talos-tools", default-features = false, features = ["file-read"] }
# Reuse the exact proptest source already pinned in Cargo.lock by the Desktop dependency graph.
proptest = { version = "1.10.0", git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b" }
image = { version = "0.25", default-features = false, features = ["png"] }
mockito = "1"
tempfile = "3"
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
