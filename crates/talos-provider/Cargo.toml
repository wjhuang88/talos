[package]
name = "talos-provider"
description = "LLM client abstractions and provider-specific implementations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.92"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
talos-config = { version = "0.9.0", path = "../talos-config" }
talos-core = { version = "0.9.0", path = "../talos-core" }
thiserror = "2.0.20"
tokio = { version = "1", features = ["sync", "macros"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
mockito = "1"
tempfile = "3"
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
