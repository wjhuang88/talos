[package]
name = "talos-session"
description = "JSONL-based session logging for Talos agent conversations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
talos-core = { version = "0.9.0", path = "../talos-core" }
async-trait = "0.1.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
sha2 = "0.11"
hex = "0.4"
zstd = { version = "0.14", optional = true }

[features]
default = ["archive-compress-zstd"]
archive-compress-zstd = ["dep:zstd"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
