name: I169 Review Remediation

# Temporary gate; delete after publishing the reviewed source commit.
on:
  push:
    branches:
      - feat/i169-tui-044-transactional-steering
    paths:
      - .github/workflows/i169-review-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0
      - name: Apply reviewed patch
        run: python3 scripts/i169_review_remediation.py
      - name: Format
        run: cargo fmt --all
      - name: Focused artifact lifecycle tests
        run: cargo test -p talos-session --test i169_session_artifact_cleanup --locked
      - name: Strict focused Clippy
        run: cargo clippy -p talos-session -p talos-agent -p talos-cli --all-targets --locked -- -D warnings
      - name: Publish remediation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/i169_review_remediation.py
          git add crates/talos-session/src/manager.rs crates/talos-session/src/lib.rs crates/talos-session/tests/i169_session_artifact_cleanup.rs crates/talos-cli/src/session_handlers.rs crates/talos-agent/src/lib.rs
          git commit -m "fix(i169): own complete session artifact lifecycle"
          git push origin HEAD:feat/i169-tui-044-transactional-steering
