name: I169 governance evidence sync

on:
  push:
    branches:
      - feat/i169-tui-044-transactional-steering

permissions:
  contents: write

concurrency:
  group: i169-governance-evidence-sync
  cancel-in-progress: true

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0

      - name: Append synchronized remediation evidence
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 40e4bb95176d60b1d58214788620b4c535fee62e HEAD
          python3 - <<'PY'
          from pathlib import Path

          sentinel = "<!-- PR131-I169-REMEDIATION-2026-08-05 -->"
          common = f"""

          {sentinel}
          ## PR #131 independent-review remediation checkpoint — 2026-08-05

          - Implementation source baseline: `40e4bb95176d60b1d58214788620b4c535fee62e`; current main / merge base: `a03e25436a25f84f117a90362686fc8205e52dde`.
          - Latest independent Review `PRR_kwDOSrj_LM8AAAABIdlncA` remains the governing `CHANGES REQUIRED` verdict until a fresh review binds to the final exact Head.
          - B1/B2/H1/M1/M2 remediation now uses one retryable Session artifact ownership boundary: WAL/SHM/SQLite precede the transcript commit point; rollback preserves primary plus cleanup diagnostics; zero-byte retention counts removals; bounded orphan reconciliation validates UUID/suffix/root/symlink/live-owner safety.
          - Production `/new`, TUI `/fork`, CLI `--fork`, transition publication rollback, Session index and fork-relation cleanup now converge on that ownership boundary while preserving the source Session.
          - Verification workflow `30997867486` passed Linux full `talos-session`/`talos-tools` gates, strict Clippy, Windows open-SQLite-handle retry, Windows redirect `20/20`, Windows full `talos-tools`, and self-cleaned all temporary remediation assets before publishing the source baseline.
          - Lifecycle state is intentionally unchanged. Final exact-head standard CI, rebuilt real-TUI acceptance, evidence synchronization and a fresh independent review remain mandatory before any advancement or merge authorization.
          """

          files = {
              "docs/backlog/active/TUI-044-transactional-batched-steering-turn.md": "TUI-044 remains **Active**; this checkpoint is implementation/review evidence, not Story completion.",
              "docs/iterations/I169-batched-steering-turn.md": "I169 remains **Active**; this checkpoint does not move the iteration to Review or Complete.",
              "docs/decisions/056-transactional-steering-submission-boundary.md": "ADR-056 remains **Proposed**; this checkpoint is not an acceptance decision.",
              "docs/backlog/PRODUCT-BACKLOG.md": "Product Backlog disposition remains TUI-044/I169 **Active** under Proposed ADR-056 and open Issue #119.",
              "docs/BOARD.md": "Derived Board disposition remains PR #131 Draft, TUI-044/I169 Active, ADR-056 Proposed, Issue #119 Open.",
              "docs/reference/ISSUE-DOC-CODE-STATUS-2026-08-01.md": "Status-matrix disposition remains Issue #119 Open, TUI-044/I169 Active, ADR-056 Proposed, PR #131 Draft.",
          }

          for name, disposition in files.items():
              path = Path(name)
              text = path.read_text()
              if sentinel in text:
                  raise SystemExit(f"sentinel already present in {name}")
              path.write_text(text.rstrip() + common + f"\n- {disposition}\n")
          PY

          git diff --check
          bash scripts/validate_project_governance.sh
          bash scripts/validate_collaboration_claims.sh
          grep -q 'status: Active' docs/backlog/active/TUI-044-transactional-batched-steering-turn.md
          grep -q 'status: Active' docs/iterations/I169-batched-steering-turn.md
          grep -q 'status: Proposed' docs/decisions/056-transactional-steering-submission-boundary.md

      - name: Publish clean governance Head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/i169-governance-sync.yml
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f -name 'i169-*' | wc -l)" -eq 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- .github/workflows docs
          git commit -m "docs(governance): sync PR 131 remediation evidence"
          git push origin HEAD:feat/i169-tui-044-transactional-steering
