name: I169 TUI Fork Fix

on:
  push:
    branches:
      - feat/i169-tui-044-transactional-steering
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-i169-tui-fork-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Apply reviewed fork remediation
        run: python3 scripts/i169_tui_fork_fix.py

      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all --check

      - name: Fork production-path regression
        run: cargo test -p talos-cli cli_fork_copies_tlog_history_runtime_identity_and_index --locked

      - name: TUI composition-root guard
        run: cargo test -p talos-cli --test i169_source_layout --locked

      - name: Full talos-cli tests
        run: cargo test -p talos-cli --locked

      - name: Strict talos-cli Clippy
        run: cargo clippy -p talos-cli --all-targets --locked -- -D warnings

      - name: Publish reviewed source fix
        env:
          TARGET_BRANCH: feat/i169-tui-044-transactional-steering
        run: |
          rm scripts/i169_tui_fork_fix.py
          git add crates/talos-cli/src/mode_runners.rs \
                  crates/talos-cli/src/session_setup.rs \
                  crates/talos-cli/tests/i169_source_layout.rs \
                  scripts/i169_tui_fork_fix.py
          if git diff --cached --quiet; then
            echo "No remediation changes produced" >&2
            exit 1
          fi
          git config user.name "wjhuang88"
          git config user.email "6157210+wjhuang88@users.noreply.github.com"
          git commit -m "fix(cli): route TUI startup forks through durable clone"
          git push origin "HEAD:${TARGET_BRANCH}"
