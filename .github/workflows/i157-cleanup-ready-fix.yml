name: I157 Cleanup Ready Fix

on:
  push:
    branches:
      - fix/i157-finalization-durability

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i157-finalization-durability
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply cleanup-ready protocol
        shell: python
        run: |
          from pathlib import Path
          import re

          journal = Path("crates/talos-config/src/store/journal.rs")
          text = journal.read_text()
          text = text.replace(
              "const MANIFEST_VERSION: u32 = 1;\n",
              "const MANIFEST_VERSION: u32 = 1;\npub(super) const CLEANUP_READY_FILE: &str = \"cleanup.ready\";\n",
              1,
          )
          replacement = r'''fn write_cleanup_ready(
              fs: &dyn Fs,
              finalize_dir: &Path,
              txn_id: &str,
          ) -> Result<(), ConfigError> {
              fs.checkpoint(FsOperation::WriteCleanupReadyMarker)?;
              fs.write_secure(
                  &finalize_dir.join(CLEANUP_READY_FILE),
                  txn_id.as_bytes(),
              )?;
              fs.checkpoint(FsOperation::SyncFinalizeDirectory)?;
              fs.sync_dir(finalize_dir)
          }

          pub(super) fn finalize_active(
              fs: &dyn Fs,
              active_dir: &Path,
              txn_id: &str,
          ) -> Result<FinalizeOutcome, ConfigError> {
              if !fs.exists(active_dir) {
                  return Ok(FinalizeOutcome::Finalized);
              }

              let parent = active_dir.parent().unwrap_or(Path::new("."));
              let finalize_dir = parent.join(format!("{FINALIZE_PREFIX}{txn_id}"));

              if fs.exists(&finalize_dir) {
                  return Err(ambiguous_finalization_error());
              }

              if fs
                  .checkpoint(FsOperation::PublishFinalizeDirectory)
                  .and_then(|_| fs.rename_dir(active_dir, &finalize_dir))
                  .is_err()
              {
                  return Ok(FinalizeOutcome::ActiveRenamePending {
                      transaction_id: txn_id.to_string(),
                  });
              }

              if fs
                  .checkpoint(FsOperation::SyncTransactionParentAfterFinalize)
                  .and_then(|_| fs.sync_dir(parent))
                  .is_err()
                  || write_cleanup_ready(fs, &finalize_dir, txn_id).is_err()
              {
                  return Ok(FinalizeOutcome::ParentSyncPending {
                      transaction_id: txn_id.to_string(),
                      finalize_dir,
                  });
              }

              if fs
                  .checkpoint(FsOperation::CleanupFinalizeDirectory)
                  .and_then(|_| fs.remove_dir(&finalize_dir))
                  .is_err()
              {
                  return Ok(FinalizeOutcome::CleanupPending {
                      transaction_id: txn_id.to_string(),
                      finalize_dir,
                  });
              }

              if fs
                  .checkpoint(FsOperation::SyncTransactionParentAfterCleanup)
                  .and_then(|_| fs.sync_dir(parent))
                  .is_err()
              {
                  return Ok(FinalizeOutcome::CleanupPending {
                      transaction_id: txn_id.to_string(),
                      finalize_dir,
                  });
              }

              Ok(FinalizeOutcome::Finalized)
          }
          '''
          text, count = re.subn(
              r"pub\(super\) fn finalize_active\([\s\S]*?\n\}\n\s*$",
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"finalize_active replacement count: {count}")
          journal.write_text(text)

          recovery = Path("crates/talos-config/src/store/recovery.rs")
          text = recovery.read_text()
          text = text.replace(
              "    finalize_active, parse_manifest, read_image, restore, validate_terminal_state, verify_state, write_manifest,\n",
              "    CLEANUP_READY_FILE, finalize_active, parse_manifest, read_image, restore,\n    validate_terminal_state, verify_state, write_manifest,\n",
              1,
          )
          replacement = r'''    fn recover_finalize_residues(
              &self,
              fs: &dyn Fs,
              parent: &Path,
          ) -> Result<RecoveryOutcome, ConfigError> {
              if !fs.exists(parent) {
                  return Ok(RecoveryOutcome::Clean);
              }

              let mut outcome = RecoveryOutcome::Clean;

              for entry in fs.list_dir(parent)? {
                  let Some(file_name) = entry.file_name() else {
                      continue;
                  };
                  let Some(name) = file_name.to_str() else {
                      continue;
                  };
                  let Some(transaction_id) = name.strip_prefix(FINALIZE_PREFIX) else {
                      continue;
                  };
                  if transaction_id.is_empty() {
                      return Err(ConfigError::InvalidConfig(
                          "finalization residue has an invalid transaction identifier".into(),
                      ));
                  }

                  if !fs.is_real_dir(&entry)? {
                      return Err(ConfigError::InvalidConfig(
                          "finalization residue is not a real directory".into(),
                      ));
                  }

                  let cleanup_ready = entry.join(CLEANUP_READY_FILE);
                  if fs.exists(&cleanup_ready) {
                      fs.checkpoint(FsOperation::ReadCleanupReadyMarker)?;
                      let marker = fs.read(&cleanup_ready)?;
                      if marker != transaction_id.as_bytes() {
                          return Err(ConfigError::InvalidConfig(
                              "finalization cleanup marker transaction identifier mismatch".into(),
                          ));
                      }
                      outcome = merge_recovery_outcomes(
                          outcome,
                          cleanup_ready_residue(fs, parent, &entry, transaction_id, None),
                      );
                      continue;
                  }

                  let manifest_path = entry.join("manifest");
                  if !fs.exists(&manifest_path) {
                      return Err(ConfigError::InvalidConfig(
                          "finalization residue exists without manifest".into(),
                      ));
                  }

                  fs.checkpoint(FsOperation::ReadFinalizeManifest)?;
                  let manifest = parse_manifest(&fs.read(&manifest_path)?)?;
                  if manifest.transaction_id != transaction_id {
                      return Err(ConfigError::InvalidConfig(
                          "finalization residue transaction identifier mismatch".into(),
                      ));
                  }

                  let terminal_phase = terminal_phase(&manifest)?;
                  validate_terminal_state(
                      fs,
                      &entry,
                      &self.config_path,
                      &self.credentials_path,
                      &manifest,
                      terminal_phase.into(),
                  )?;

                  if fs
                      .checkpoint(FsOperation::SyncFinalizeResidueParent)
                      .and_then(|_| fs.sync_dir(parent))
                      .is_err()
                      || fs
                          .checkpoint(FsOperation::WriteCleanupReadyMarker)
                          .and_then(|_| {
                              fs.write_secure(&cleanup_ready, transaction_id.as_bytes())
                          })
                          .is_err()
                      || fs
                          .checkpoint(FsOperation::SyncFinalizeDirectory)
                          .and_then(|_| fs.sync_dir(&entry))
                          .is_err()
                  {
                      return Ok(RecoveryOutcome::ParentSyncPending {
                          transaction_id: transaction_id.to_string(),
                          phase: terminal_phase,
                          finalize_dir: entry,
                      });
                  }

                  outcome = merge_recovery_outcomes(
                      outcome,
                      cleanup_ready_residue(
                          fs,
                          parent,
                          &entry,
                          transaction_id,
                          Some(terminal_phase),
                      ),
                  );
              }

              Ok(outcome)
          }

          fn cleanup_prepare_residues'''
          text, count = re.subn(
              r"    fn recover_finalize_residues\([\s\S]*?\n    fn cleanup_prepare_residues",
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"recover_finalize_residues replacement count: {count}")
          helper = r'''
          fn cleanup_ready_residue(
              fs: &dyn Fs,
              parent: &Path,
              entry: &Path,
              transaction_id: &str,
              phase: Option<TerminalPhase>,
          ) -> RecoveryOutcome {
              let phase = phase.unwrap_or(TerminalPhase::Committed);
              if fs
                  .checkpoint(FsOperation::CleanupFinalizeDirectory)
                  .and_then(|_| fs.remove_dir(entry))
                  .is_err()
              {
                  return RecoveryOutcome::CleanupPending {
                      transaction_id: transaction_id.to_string(),
                      phase,
                      finalize_dir: entry.to_path_buf(),
                  };
              }

              if fs
                  .checkpoint(FsOperation::SyncTransactionParentAfterCleanup)
                  .and_then(|_| fs.sync_dir(parent))
                  .is_err()
              {
                  return RecoveryOutcome::CleanupPending {
                      transaction_id: transaction_id.to_string(),
                      phase,
                      finalize_dir: entry.to_path_buf(),
                  };
              }

              RecoveryOutcome::Clean
          }

          '''
          marker = "fn terminal_phase(manifest: &Manifest)"
          if marker not in text:
              raise SystemExit("terminal_phase marker missing")
          text = text.replace(marker, helper + marker, 1)
          recovery.write_text(text)

          tests = Path("crates/talos-config/src/tests.rs")
          text = tests.read_text()
          text, count1 = re.subn(
              r"#\[test\]\nfn finalize_residue_not_deleted_by_cleanup_residues\(\) \{[\s\S]*?\n\}\n\n#\[test\]\nfn corrupt_credentials_marker_not_in_display_or_debug",
              '''#[test]
          fn malformed_finalize_residue_is_preserved_and_fails_closed() {
              let dir = unique_test_dir("finalize-retain");
              let _ = setup_full_fixture(&dir);
              let finalize_dir = dir.join(".provider-unset-transaction.finalize.orphan-3");
              fs::create_dir_all(&finalize_dir).unwrap();
              fs::write(finalize_dir.join("manifest"), b"stale").unwrap();

              let store = make_store(&dir);
              assert!(store.recover(&StdFs).is_err());
              assert!(finalize_dir.exists());
              let _ = fs::remove_dir_all(&dir);
          }

          #[test]
          fn corrupt_credentials_marker_not_in_display_or_debug''',
              text,
              count=1,
          )
          text, count2 = re.subn(
              r"#\[test\]\nfn finalize_residue_does_not_block_new_mutation\(\) \{[\s\S]*?\n\}\n\n#\[test\]\nfn prepare_residue_does_not_block_load_effective",
              '''#[test]
          fn malformed_finalize_residue_blocks_new_mutation() {
              let dir = unique_test_dir("finalize-residue-invalid");
              let (cfg_before, cred_before) = setup_full_fixture(&dir);
              let residue_dir = dir.join(".provider-unset-transaction.finalize.orphan-1");
              fs::create_dir_all(&residue_dir).unwrap();
              fs::write(residue_dir.join("manifest"), b"stale").unwrap();
              let store = make_store(&dir);
              assert!(store.unset_provider("providers.custom-a").is_err());
              assert_both_unchanged(&dir, &cfg_before, &cred_before);
              assert!(residue_dir.exists());
              let _ = fs::remove_dir_all(&dir);
          }

          #[test]
          fn prepare_residue_does_not_block_load_effective''',
              text,
              count=1,
          )
          if (count1, count2) != (1, 1):
              raise SystemExit(f"legacy test replacement counts: {count1}, {count2}")
          tests.write_text(text)
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          git rm .github/workflows/i157-cleanup-ready-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/talos-config/src/store/fs.rs \
            crates/talos-config/src/store/journal.rs \
            crates/talos-config/src/store/recovery.rs \
            crates/talos-config/src/tests.rs
          git commit -m "fix(config): persist cleanup-only finalization state"
          git push origin HEAD:fix/i157-finalization-durability
