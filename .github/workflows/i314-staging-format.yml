name: I314 staging formatter

on:
  push:
    branches:
      - tmp/i314-ci3796-fix-20261103

permissions:
  contents: write

jobs:
  format-and-fix:
    if: ${{ !contains(github.event.head_commit.message, '[i314-staging-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/i314-ci3796-fix-20261103
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
      - name: Apply MCP fail-closed correction
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/talos-cli/src/mode_runners.rs')
          text = path.read_text()
          old = '''    let config_for_logging = Config::load().ok();
              init_logger(
                  config_for_logging.as_ref().map(|config| &config.log),
                  false,
                  None,
              );

              let search = config_for_logging
                  .as_ref()
                  .map(crate::mode_print::search_configuration::project_search_configuration)
                  .transpose()?
                  .unwrap_or(talos_tools::SearchToolConfiguration::Auto);
          '''
          new = '''    let config_for_logging =
                  Config::load().context("failed to load configuration")?;
              init_logger(Some(&config_for_logging.log), false, None);

              let search = crate::mode_print::search_configuration::project_search_configuration(
                  &config_for_logging,
              )?;
          '''
          if old not in text:
              raise SystemExit('expected MCP configuration block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit staging correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gerald Huang'
          git config user.email 'wjhng88@gmail.com'
          git add crates/talos-cli crates/talos-config crates/talos-tools crates/talos-runtime
          if git diff --cached --quiet; then
            echo 'No formatting changes to commit.'
            exit 0
          fi
          git commit -m 'fix(search): close I314 formatting and MCP config gaps (#832) [model:gpt-5.6-sol] [i314-staging-formatted]'
          git push origin HEAD:tmp/i314-ci3796-fix-20261103
