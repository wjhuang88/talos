name: I169 one-shot format

on:
  push:
    branches:
      - feat/i169-tui-044-transactional-steering

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply locked rustfmt
        run: cargo fmt --all
      - name: Commit exact formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style(i169): apply locked rustfmt (#131)"
          git push origin HEAD:feat/i169-tui-044-transactional-steering
