name: I169 final remediation gate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/i169-source-verify2.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply reviewed remediation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/i169-followup2.patch.gz.b64.part* | base64 --decode | gzip --decompress > /tmp/followup.patch
          test "$(sha256sum /tmp/followup.patch | cut -d' ' -f1)" = "39e833b09a8074351f4e9ead8696f6db39d50b2cc307bac21b56cbfb83a206ac"
          git apply --index /tmp/followup.patch
          base64 --decode .github/i169-followup2-testfix.patch.gz.b64 | gzip --decompress > /tmp/testfix.patch
          test "$(sha256sum /tmp/testfix.patch | cut -d' ' -f1)" = "1f34e7b342f3513dfb344bbfd68e47fa025893ac7ce5c4f5daa79ed3ea0a6924"
          git apply --index /tmp/testfix.patch

          python3 - <<'PY'
          import base64, gzip, hashlib, re
          from pathlib import Path
          workflow = Path('.github/workflows/i169-source-export.yml').read_text()
          matches = re.findall(
              r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 --decode \| gzip --decompress > /tmp/i169-followup2-testwiring.patch",
              workflow,
          )
          if len(matches) != 1:
              raise SystemExit(f'expected one embedded wiring patch, found {len(matches)}')
          patch = gzip.decompress(base64.b64decode(matches[0]))
          digest = hashlib.sha256(patch).hexdigest()
          if digest != '80063619f570976929ade9a1c4f57b0c0e762c8c43a1cddbb1564d835c1e7747':
              raise SystemExit(f'unexpected wiring patch digest: {digest}')
          Path('/tmp/wiring.patch').write_bytes(patch)
          PY
          set +e
          git apply --reject /tmp/wiring.patch
          status=$?
          set -e
          test "$status" -eq 1
          mapfile -t rejects < <(find crates -name '*.rej' -type f)
          test "${#rejects[@]}" -eq 1
          test "${rejects[0]}" = "crates/talos-cli/src/mode_runners_tests.rs.rej"
          grep -q nonexistent-provider "${rejects[0]}"

          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected} match(es), found {actual}')
              file.write_text(text.replace(old, new))

          replace_exact(
              'crates/talos-cli/src/mode_runners_tests.rs',
              '''        let model_result = handle_session_model(
                  &transition,
                  &ui_tx,
                  &config,
                  &hooks,
                  workspace.path(),
                  &mcp_config,
                  &session_watch_tx,
                  &sq_tx_watch_tx,
                  &bridge_tx,
                  &session_watch_rx,
                  &session_manager,
                  "nonexistent-model".to_string(),
                  Some("nonexistent-provider".to_string()),
                  true,
              )
              ''',
              '''        let model_result = handle_session_model(
                  &transition,
                  &ui_tx,
                  &config,
                  &runtime_builder,
                  &session_watch_tx,
                  &sq_tx_watch_tx,
                  &bridge_tx,
                  &session_watch_rx,
                  "nonexistent-model".to_string(),
                  Some("nonexistent-provider".to_string()),
              )
              ''',
          )
          Path('crates/talos-cli/src/mode_runners_tests.rs.rej').unlink()

          layout = 'crates/talos-cli/tests/i169_source_layout.rs'
          replace_exact(
              layout,
              '''    let success = source
                  .find("MessageSource::System,\\n                success_message")
                  .expect("model-switch success publication");
              ''',
              '''    let success = publish
                  + source[publish..]
                      .find("success_message,")
                      .expect("model-switch success publication after acknowledged route install");
              ''',
          )
          replace_exact(
              layout,
              '''        let source = fs::read_to_string(crate_root.join(root))
                  .unwrap_or_else(|error| panic!("read {root}: {error}"));
              ''',
              '''        let source = fs::read_to_string(crate_root.join(root))
                  .unwrap_or_else(|error| panic!("read {root}: {error}"));
              let production_source = source
                  .split("\\n#[cfg(test)]")
                  .next()
                  .expect("production source prefix");
              ''',
          )
          replace_exact(
              layout,
              '''                !source.contains(forbidden),
                  "ad-hoc TUI runtime construction escaped the shared builder in {root}: {forbidden}"
              ''',
              '''                !production_source.contains(forbidden),
                  "ad-hoc production TUI runtime construction escaped the shared builder in {root}: {forbidden}"
              ''',
          )
          replace_exact(
              layout,
              '        assert!(source.contains("TuiRuntimeBuilder"));\n',
              '        assert!(production_source.contains("TuiRuntimeBuilder"));\n',
          )
          PY

          cargo fmt --all
          git add -A
          cargo fmt --all -- --check
          git diff --cached --check

      - name: Workspace compile
        run: cargo check --workspace --locked

      - name: Focused remediation tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p talos-agent configured_output_limit_above_4096_is_reserved_before_dispatch --locked
          cargo test -p talos-agent declared_image_size_is_conservatively_budgeted_before_dispatch --locked
          cargo test -p talos-agent multiple_declared_images_saturate_budget_instead_of_overflowing --locked
          cargo test -p talos-session --test i169_runtime_identity --locked
          cargo test -p talos-session runtime_activation_stage_is_generation_atomic_and_restart_recoverable --locked
          cargo test -p talos-cli publication_failure_stops_replacement_without_success --locked
          cargo test -p talos-cli session_owned_activation_survives_repeated_production_compaction --locked
          cargo test -p talos-cli --test i169_source_layout --locked

      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Commit verified remediation and remove temporary facilities
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/i169-followup.patch.gz.b64.part* \
            .github/i169-followup2.patch.gz.b64.part* \
            .github/i169-followup2-testfix.patch.gz.b64 \
            .github/workflows/i169-source-export.yml \
            .github/workflows/i169-source-verify2.yml
          git diff --cached --check
          git config user.name talos-governance-bot
          git config user.email actions@users.noreply.github.com
          git commit -m "fix(i169): harden session runtime reconstruction"
          git push origin HEAD:feat/i169-tui-044-transactional-steering
