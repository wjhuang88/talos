name: I169 final remediation gate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/i169-source-verify2.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply reviewed remediation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/i169-followup2.patch.gz.b64.part* | base64 --decode | gzip --decompress > /tmp/followup.patch
          test "$(sha256sum /tmp/followup.patch | cut -d' ' -f1)" = "39e833b09a8074351f4e9ead8696f6db39d50b2cc307bac21b56cbfb83a206ac"
          git apply --index /tmp/followup.patch
          base64 --decode .github/i169-followup2-testfix.patch.gz.b64 | gzip --decompress > /tmp/testfix.patch
          test "$(sha256sum /tmp/testfix.patch | cut -d' ' -f1)" = "1f34e7b342f3513dfb344bbfd68e47fa025893ac7ce5c4f5daa79ed3ea0a6924"
          git apply --index /tmp/testfix.patch

          python3 - <<'PY'
          import base64, gzip, hashlib, re
          from pathlib import Path
          workflow = Path('.github/workflows/i169-source-export.yml').read_text()
          matches = re.findall(
              r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 --decode \| gzip --decompress > /tmp/i169-followup2-testwiring.patch",
              workflow,
          )
          if len(matches) != 1:
              raise SystemExit(f'expected one embedded wiring patch, found {len(matches)}')
          patch = gzip.decompress(base64.b64decode(matches[0]))
          digest = hashlib.sha256(patch).hexdigest()
          if digest != '80063619f570976929ade9a1c4f57b0c0e762c8c43a1cddbb1564d835c1e7747':
              raise SystemExit(f'unexpected wiring patch digest: {digest}')
          Path('/tmp/wiring.patch').write_bytes(patch)
          PY
          set +e
          git apply --reject /tmp/wiring.patch
          status=$?
          set -e
          test "$status" -eq 1
          mapfile -t rejects < <(find crates -name '*.rej' -type f)
          test "${#rejects[@]}" -eq 1
          test "${rejects[0]}" = "crates/talos-cli/src/mode_runners_tests.rs.rej"
          grep -q nonexistent-provider "${rejects[0]}"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/talos-cli/src/mode_runners_tests.rs')
          text = path.read_text()
          marker = 'Some("nonexistent-provider".to_string())'
          marker_at = text.index(marker)
          start = text.rfind('        let model_result = handle_session_model(', 0, marker_at)
          end = text.index('        .await;', marker_at) + len('        .await;\n')
          if start < 0:
              raise SystemExit('failed to locate rejected model-result call')
          block = text[start:end]
          for required in ['&hooks,', 'workspace.path(),', '&mcp_config,', '&session_manager,', 'true,']:
              if required not in block:
                  raise SystemExit(f'rejected call missing expected token: {required}')
          rewritten = block.replace(
              '            &hooks,\n            workspace.path(),\n            &mcp_config,\n',
              '            &runtime_builder,\n',
          ).replace('            &session_manager,\n', '').replace('            true,\n', '')
          path.write_text(text[:start] + rewritten + text[end:])
          Path('crates/talos-cli/src/mode_runners_tests.rs.rej').unlink()

          layout_path = Path('crates/talos-cli/tests/i169_source_layout.rs')
          layout = layout_path.read_text()
          function_start = layout.index('fn model_switch_activation_durability_precedes_replacement_publication()')
          success_start = layout.index('    let success = source', function_start)
          success_end = layout.index('        .expect("model-switch success publication");', success_start)
          success_end += len('        .expect("model-switch success publication");\n')
          success_replacement = '''    let success = publish
              + source[publish..]
                  .find("success_message,")
                  .expect("model-switch success publication after acknowledged route install");
          '''
          layout = layout[:success_start] + success_replacement + layout[success_end:]

          helper_end = layout.index('\n/// Test-only compatibility harness', function_start)
          helper_guard = layout[function_start:helper_end]
          old_fence = '.find(".quiesce_same_session(session)")\n        .expect("old runtime retirement");'
          new_fence = '.find(".quiesce_same_session_for_activation(session, &activation)")\n        .expect("atomic activation stage and old-runtime retirement");'
          if helper_guard.count(old_fence) != 1:
              raise SystemExit(f'expected one old fence guard, found {helper_guard.count(old_fence)}')
          helper_guard = helper_guard.replace(old_fence, new_fence)
          if helper_guard.count('    assert!(fence < activation);') != 1:
              raise SystemExit('expected one obsolete fence ordering assertion')
          helper_guard = helper_guard.replace(
              '    assert!(fence < activation);\n    assert!(activation < tail_check);',
              '    assert!(activation < fence);\n    assert!(fence < tail_check);',
          )
          layout = layout[:function_start] + helper_guard + layout[helper_end:]

          guard_start = layout.index('fn tui_runtime_construction_is_centralized_in_the_shared_builder()')
          guard_end = layout.index('\n}\n\n#[test]\nfn every_production_provider_root', guard_start) + 2
          replacement_guard = '''fn tui_runtime_construction_is_centralized_in_the_shared_builder() {
              let crate_root = Path::new(env!("CARGO_MANIFEST_DIR"));
              let builder = fs::read_to_string(crate_root.join("src/tui_runtime_builder.rs"))
                  .expect("read TUI runtime builder source");
              assert!(builder.contains("AppServerSession::new("));
              assert!(builder.contains("McpSessionRuntime::start("));
              assert!(builder.contains("set_request_budget_spec("));

              for (root, required_builder_boundary) in [
                  (
                      "src/model_lifecycle.rs",
                      "runtime_builder: &'a TuiRuntimeBuilder",
                  ),
                  (
                      "src/session_handlers.rs",
                      "runtime_builder: &TuiRuntimeBuilder",
                  ),
              ] {
                  let source = fs::read_to_string(crate_root.join(root))
                      .unwrap_or_else(|error| panic!("read {root}: {error}"));
                  for forbidden in [
                      "AppServerSession::new(",
                      "McpSessionRuntime::start(",
                      "build_tui_tool_registry(",
                  ] {
                      assert!(
                          !source.contains(forbidden),
                          "ad-hoc production TUI runtime construction escaped the shared builder in {root}: {forbidden}"
                      );
                  }
                  assert!(
                      source.contains(required_builder_boundary),
                      "production runtime transition must accept the shared TuiRuntimeBuilder in {root}"
                  );
              }
          }'''
          layout_path.write_text(layout[:guard_start] + replacement_guard + layout[guard_end:])
          PY

          cargo fmt --all
          git add -A
          cargo fmt --all -- --check
          git diff --cached --check

      - name: Workspace compile
        run: cargo check --workspace --locked

      - name: Agent request-budget regression tests
        run: |
          cargo test -p talos-agent configured_output_limit_above_4096_is_reserved_before_dispatch --locked
          cargo test -p talos-agent declared_image_size_is_conservatively_budgeted_before_dispatch --locked
          cargo test -p talos-agent multiple_declared_images_saturate_budget_instead_of_overflowing --locked

      - name: Session runtime-identity regression tests
        run: |
          cargo test -p talos-session --test i169_runtime_identity --locked
          cargo test -p talos-session runtime_activation_stage_is_generation_atomic_and_restart_recoverable --locked

      - name: CLI publication and compaction regression tests
        run: |
          cargo test -p talos-cli publication_failure_stops_replacement_without_success --locked
          cargo test -p talos-cli session_owned_activation_survives_repeated_production_compaction --locked

      - name: Source-layout boundary tests
        run: cargo test -p talos-cli --test i169_source_layout --locked

      - name: Full talos-cli test suite
        run: cargo test -p talos-cli --locked

      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Commit verified remediation and remove temporary facilities
        shell: bash
        run: |
          set -euo pipefail
          find .github -maxdepth 1 -type f -name 'i169-followup*.patch.gz.b64*' -print0 | xargs -0 -r git rm -f --
          git rm -f .github/workflows/i169-source-export.yml .github/workflows/i169-source-verify2.yml
          git diff --cached --check
          git config user.name talos-governance-bot
          git config user.email actions@users.noreply.github.com
          git commit -m "fix(i169): harden session runtime reconstruction"
          git push origin HEAD:feat/i169-tui-044-transactional-steering
