name: I169 one-shot clippy cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/i169-clippy-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Replace opaque test unwraps deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path("crates/talos-exploration/src"),
              Path("crates/talos-memory/src"),
          ]
          observed = {}
          changed_files = []
          for root in roots:
              count = 0
              for path in sorted(root.rglob("*.rs")):
                  text = path.read_text()
                  file_count = text.count(".unwrap()") + text.count(".unwrap_err()")
                  if not file_count:
                      continue
                  updated = text.replace(
                      ".unwrap_err()",
                      '.expect_err("test operation should fail as expected")',
                  ).replace(
                      ".unwrap()",
                      '.expect("test operation should succeed")',
                  )
                  path.write_text(updated)
                  count += file_count
                  changed_files.append(str(path))
              if count == 0:
                  raise SystemExit(f"expected strict-Clippy unwrap diagnostics under {root}")
              observed[str(root)] = count

          print(f"observed replacements: {observed}")
          print("changed files:")
          print("\n".join(changed_files))
          PY
          cargo fmt --all
          git diff --check

      - name: Verify affected all-targets Clippy scope
        run: cargo clippy -p talos-memory -p talos-exploration --all-targets --locked -- -D warnings

      - name: Publish cleanup and trigger full remediation gate
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# clippy-baseline-trigger: 2026-08-04\n' >> .github/workflows/i169-source-verify2.yml
          git rm -f .github/workflows/i169-clippy-cleanup.yml
          git add crates/talos-memory/src crates/talos-exploration/src .github/workflows/i169-source-verify2.yml
          git diff --cached --check
          git config user.name talos-governance-bot
          git config user.email actions@users.noreply.github.com
          git commit -m "test(clippy): make memory and exploration failures explicit"
          git push origin HEAD:feat/i169-tui-044-transactional-steering
