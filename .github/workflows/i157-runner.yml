name: I157 correction runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i157-post-merge-durability-concurrency
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Extract and apply correction script
        shell: bash
        run: |
          git fetch origin automation/i157-post-merge-fix
          git show origin/automation/i157-post-merge-fix:.github/workflows/i157-post-merge-fix.yml > /tmp/i157-source.yml
          python3 <<'PY'
          from pathlib import Path
          lines = Path('/tmp/i157-source.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = []
          for line in lines[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(body) + '\n'

          brittle = 'replace_once("crates/talos-config/src/store/recovery.rs", old_arm, new_arm)'
          robust = '''p = Path("crates/talos-config/src/store/recovery.rs")
          text = p.read_text()
          start_marker = "            Phase::Prepared | Phase::Applying | Phase::RollbackRequired => {"
          end_marker = "            Phase::RolledBack => {"
          start_index = text.index(start_marker)
          end_index = text.index(end_marker, start_index)
          p.write_text(text[:start_index] + new_arm + text[end_index:])'''
          if brittle not in script:
              raise SystemExit('brittle recovery replacement not found in extracted script')
          script = script.replace(brittle, robust, 1)

          brittle_cleanup = 'replace_once("crates/talos-config/src/store/recovery.rs", old_cleanup, new_cleanup)'
          robust_cleanup = '''p = Path("crates/talos-config/src/store/recovery.rs")
          text = p.read_text()
          start_marker = "            // Preparation residues are unpublished and never interpreted."
          end_marker = "        }\\n\\n        Ok(())\\n    }"
          start_index = text.index(start_marker)
          end_index = text.index(end_marker, start_index)
          p.write_text(text[:start_index] + new_cleanup + text[end_index:])'''
          if brittle_cleanup not in script:
              raise SystemExit('brittle prepare cleanup replacement not found in extracted script')
          script = script.replace(brittle_cleanup, robust_cleanup, 1)

          Path('/tmp/apply_i157.py').write_text(script)
          PY
          python3 /tmp/apply_i157.py
          python3 <<'PY'
          from pathlib import Path

          fs_path = Path('crates/talos-config/src/store/fs.rs')
          fs_text = fs_path.read_text()
          fs_text = fs_text.replace('    CleanupPrepareResidues,\n', '', 1)
          fs_path.write_text(fs_text)

          tests_path = Path('crates/talos-config/src/tests.rs')
          tests = tests_path.read_text()
          old = '''#[test]
          fn test_load_nonexistent_file() {
              let path = Config::default_path();
              if path.exists() {
                  return;
              }
              let config = Config::load().unwrap();
              assert_eq!(config.provider, "anthropic");
              assert!(config.model.is_empty());
          }
          '''
          new = '''#[test]
          fn test_load_nonexistent_file() {
              let dir = std::env::temp_dir().join(format!(
                  "talos-config-nonexistent-{}-{}",
                  std::process::id(),
                  std::time::SystemTime::now()
                      .duration_since(std::time::UNIX_EPOCH)
                      .unwrap()
                      .as_nanos()
              ));
              std::fs::create_dir_all(&dir).unwrap();
              let store = ConfigStore::with_paths(
                  dir.join("config.toml"),
                  dir.join("credentials.toml"),
              );
              let config = store.load_effective().unwrap();
              assert_eq!(config.provider, "anthropic");
              assert!(config.model.is_empty());
              let _ = std::fs::remove_dir_all(dir);
          }
          '''
          if tests.count(old) != 1:
              raise SystemExit(f'test_load_nonexistent_file replacement count: {tests.count(old)}')
          tests_path.write_text(tests.replace(old, new, 1))
          PY
      - name: Format and focused validation
        run: |
          cargo fmt --all
          cargo test --locked -p talos-config
          cargo test --locked -p talos-cli --test config_unset_finalization
          cargo clippy --locked -p talos-config -- -D warnings
      - name: Commit and push correction
        shell: bash
        run: |
          git config user.name "i157-correction-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates/talos-config
          git commit -m "fix(config): prevent stale provider-unset overwrite (#MODEL-010 #I157)"
          git push origin HEAD:fix/i157-post-merge-durability-concurrency
