name: I169 generation handoff launcher

on:
  push:
    branches:
      - feat/i169-tui-044-transactional-steering

permissions:
  contents: write

jobs:
  launch-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0
      - name: Verify expected parent
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "45193852243783ce2925cd08bbb7c4ba0cdb14a3"
      - name: Execute staged exact remediation
        shell: bash
        run: |
          python3 - <<'PYRUN'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/i169-generation-handoff-remediation.yml').read_text()
          start = workflow.index('          from pathlib import Path\n')
          end = workflow.index('\n          PY\n', start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'i169-generation-handoff-remediation', 'exec'))
          PYRUN
      - name: Remove one-time workflows
        shell: bash
        run: rm .github/workflows/i169-generation-handoff-remediation.yml .github/workflows/i169-generation-handoff-launcher.yml
      - name: Format and validate targeted remediation
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          cargo test -p talos-session pending_submission --locked
          cargo test -p talos-cli session_transition --locked
          cargo test -p talos-agent --test i169_generation_boundary --test i169_old_generation_reconcile --locked
      - name: Commit final remediation
        shell: bash
        run: |
          git config user.name "talos-remediation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(i169): fence generation handoff before runtime replacement"
          git push origin HEAD:feat/i169-tui-044-transactional-steering
