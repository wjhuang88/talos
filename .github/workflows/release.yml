name: I158 CLI Todo Wiring

on:
  push:
    branches:
      - feature/i158-cli-todo-contributions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/i158-cli-todo-contributions
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Apply and format CLI wiring
        run: |
          python scripts/tmp_i158_cli_todo_contributions.py
          cargo fmt --all
          git diff --check
      - name: Commit clean implementation tree
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release.yml
          rm -f scripts/tmp_i158_cli_todo_contributions.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(cli): consume session todo contributions"
          git push origin HEAD:feature/i158-cli-todo-contributions
