name: I158 Core Contribution Contract

on:
  push:
    branches:
      - feature/i158-core-tool-contributions

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/i158-core-tool-contributions
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Apply core contribution contract
        run: python scripts/tmp_i158_core_contributions.py
      - name: Format and validate
        run: |
          cargo fmt --all
          git diff --check
          cargo test --locked -p talos-core
          cargo clippy --locked -p talos-core --all-targets -- -D warnings
          cargo check --workspace --locked
          scripts/validate_project_governance.sh .
      - name: Commit validated implementation
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release.yml
          rm -f scripts/tmp_i158_core_contributions.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(core): add checked tool contributions"
          git push origin HEAD:feature/i158-core-tool-contributions
