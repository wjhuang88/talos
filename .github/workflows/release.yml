name: I158 Activation Baseline Correction

on:
  push:
    branches:
      - docs/adr053-accept-i158

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/adr053-accept-i158
          fetch-depth: 0
      - name: Correct activation baseline
        run: python scripts/tmp_i158_baseline_fix.py
      - name: Validate governance
        run: |
          git diff --check
          scripts/validate_project_governance.sh .
      - name: Commit correction
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release.yml
          rm -f scripts/tmp_i158_baseline_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(iteration): correct I158 activation baseline"
          git push origin HEAD:docs/adr053-accept-i158
