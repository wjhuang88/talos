name: ADR-053 Acceptance And I158 Activation

on:
  push:
    branches:
      - docs/adr053-accept-i158

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/adr053-accept-i158
          fetch-depth: 0
      - name: Apply owner and derived state updates
        run: python scripts/tmp_adr053_activation.py
      - name: Validate governance changes
        run: |
          git diff --check
          scripts/validate_project_governance.sh .
      - name: Commit validated activation
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/release.yml
          rm -f .github/workflows/adr053-activation-sync.yml \
            docs/.adr053-activation-trigger \
            scripts/tmp_adr053_activation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(architecture): accept ADR-053 and activate I158"
          git push origin HEAD:docs/adr053-accept-i158
