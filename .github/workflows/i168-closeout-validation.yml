name: I168 Closeout Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  record-closeout:
    if: github.head_ref == 'agent/i168-terminal-closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/i168-terminal-closeout
          fetch-depth: 0
      - name: Apply validated I168 closeout packet
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2eac5b0523f6d8006318456b631c72cdb5bf9bed HEAD
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/i168-record-closeout.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          Path('/tmp/i168_record_closeout.py').write_text(script + "\n")
          PY
          python3 /tmp/i168_record_closeout.py
          scripts/validate_project_governance.sh .
          git diff --check
          grep -Fq '> Document status: Complete (2026-07-30)' docs/iterations/I168-provider-terminal-outcome-integrity.md
          grep -Fq '| Status | Complete — I168 accepted (2026-07-30) |' docs/backlog/active/RUNTIME-003-provider-terminal-outcome-integrity.md
          grep -Fq '| Status | Refinement — ADR decision required before Ready |' docs/backlog/active/OBS-002-turn-pipeline-boundary-observability.md
          grep -Fq 'Completion Commit: `2eac5b0523f6d8006318456b631c72cdb5bf9bed`' docs/iterations/I168-provider-terminal-outcome-integrity.md
          rm -f \
            .github/workflows/i168-record-closeout.yml \
            .github/workflows/i168-closeout-validation.yml \
            .i168-record-closeout-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(iteration): record I168 terminal outcome evidence (#RUNTIME-003 #I168) [model:gpt-5.6-thinking]'
          git push origin HEAD:agent/i168-terminal-closeout
