name: PR83 README patch

on:
  push:
    branches:
      - agent/agent-collaboration-governance

permissions:
  contents: write

jobs:
  patch-readmes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agent-collaboration-governance
          fetch-depth: 0

      - name: Patch collaboration guidance
        shell: python
        run: |
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = """Before starting implementation, claim the GitHub Issue or existing governed task through
          [Agent Collaboration And Task Claiming](docs/sop/AGENT-COLLABORATION.md).

          For PR-based work, task claiming and implementation are separate stages:

          1. Submit and merge a governance-only claim PR.
          2. Create the implementation branch from the updated target branch and submit the implementation
             PR.
          3. After implementation merges, submit the governance closure update with the existing
             implementation commit as completion evidence.

          An open claim PR does not reserve the task, and implementation must not begin before the claim is
          present on the target branch.
          """
          new = """For governed implementation started after the adoption of PR `#83`, follow
          [Agent Collaboration And Task Claiming](docs/sop/AGENT-COLLABORATION.md): finalize the
          owner-document claim with the actual claim PR number, merge it through an authorized path, and
          create the implementation branch from that target-branch claim. An open claim PR does not reserve
          work.

          Existing pre-adoption work is grandfathered. Wording-only documentation fixes, broken links,
          formatting, reviewer follow-ups within the same scope, and mechanically bounded CI/fixture
          maintenance may use one PR when they do not change behavior, API, security, dependencies, release
          authorization, persistent data, or owner status. Time-critical incident and security response may
          use the documented emergency override, with governance reconciled within two business days.
          """
          if old not in text:
              raise SystemExit("expected English collaboration block not found")
          text = text.replace(old, new, 1)
          readme.write_text(text.rstrip("\n") + "\n", encoding="utf-8")

          zh = Path("README.zh-CN.md")
          zh_text = zh.read_text(encoding="utf-8")
          marker = """## 贡献与本地检查

          常用检查命令：
          """
          replacement = """## 贡献与本地检查

          PR `#83` 采用之后新启动的受治理实现，应先遵循
          [智能体协作与任务认领](docs/sop/AGENT-COLLABORATION.md)：在 owner document 中回填真实的
          claim PR 编号，通过允许的授权路径合并认领，再从包含该认领记录的目标分支创建实现分支。
          仍处于 Open 状态的 claim PR 不构成任务占用。

          采用前已经存在的工作按原治理基线完成。仅修改措辞、修复链接或格式、同一 PR 范围内的
          reviewer follow-up，以及不改变行为、API、安全、依赖、发布授权、持久化数据或 owner 状态的
          机械性 CI/fixture 维护，可以使用单 PR。紧急事故与安全响应可使用文档规定的 emergency
          override，但应在完成遏制后的两个工作日内补齐治理状态。

          常用检查命令：
          """
          if marker not in zh_text:
              raise SystemExit("expected Chinese contribution marker not found")
          zh_text = zh_text.replace(marker, replacement, 1)
          table_marker = "| Git 工作流 | [docs/sop/GIT-WORKFLOW.md](docs/sop/GIT-WORKFLOW.md) |"
          table_row = "| 智能体协作与任务认领 | [docs/sop/AGENT-COLLABORATION.md](docs/sop/AGENT-COLLABORATION.md) |\n"
          if table_row.strip() not in zh_text:
              if table_marker not in zh_text:
                  raise SystemExit("expected Chinese documentation table marker not found")
              zh_text = zh_text.replace(table_marker, table_row + table_marker, 1)
          zh.write_text(zh_text.rstrip("\n") + "\n", encoding="utf-8")

          Path(".github/workflows/pr83-readme-patch.yml").unlink()

      - name: Commit patched readmes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md README.zh-CN.md .github/workflows/pr83-readme-patch.yml
          git commit -m "docs(readme): clarify collaboration adoption and exceptions [model:gpt-5.6-thinking]"
          git push origin HEAD:agent/agent-collaboration-governance
