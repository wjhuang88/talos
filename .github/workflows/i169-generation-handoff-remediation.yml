name: I169 generation handoff remediation

on:
  push:
    branches:
      - feat/i169-tui-044-transactional-steering

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.actor == 'wjhuang88'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0
      - name: Verify expected parent
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "85ff3c6bc7a7eb76d5b3702588e032ca897a3167"
      - name: Apply exact remediation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, text: str) -> None:
              Path(path).write_text(text)

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              text = read(path)
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} exact matches, found {actual}")
              write(path, text.replace(old, new))

          pending = "crates/talos-session/src/pending_submission.rs"
          replace_exact(
              pending,
              '''    /// The durable runtime generation cannot advance further.\n    #[error("runtime generation exhausted")]\n    GenerationExhausted,\n''',
              '''    /// Non-terminal durable custody still belongs to the current generation.\n    #[error(\n        "runtime generation {generation} still owns {pending} non-terminal submission(s)"\n    )]\n    GenerationBusy {\n        /// Generation that still owns custody.\n        generation: u64,\n        /// Number of non-terminal durable records.\n        pending: usize,\n    },\n    /// The durable runtime generation cannot advance further.\n    #[error("runtime generation exhausted")]\n    GenerationExhausted,\n''',
          )
          replace_exact(
              pending,
              '''        if current != expected {\n            return Err(PendingSubmissionError::GenerationConflict {\n                expected,\n                actual: current,\n            });\n        }\n        let next = current\n''',
              '''        if current != expected {\n            return Err(PendingSubmissionError::GenerationConflict {\n                expected,\n                actual: current,\n            });\n        }\n        let pending = transaction.query_row(\n            "SELECT COUNT(*) FROM pending_submissions\n             WHERE state IN ('accepted_pending', 'running', 'paused_pending')",\n            [],\n            |row| row.get::<_, i64>(0),\n        )?;\n        if pending > 0 {\n            return Err(PendingSubmissionError::GenerationBusy {\n                generation: current,\n                pending: usize::try_from(pending).unwrap_or(usize::MAX),\n            });\n        }\n        let next = current\n''',
          )
          replace_exact(
              pending,
              '''        }\n\n        prune_tombstones(&transaction)?;\n        if exceeds_pending_bounds(&transaction, text_bytes, image_count, image_bytes)? {\n''',
              '''        }\n\n        let runtime_generation = load_or_initialize_runtime_generation(&transaction)?;\n        if submission.sender_generation != runtime_generation {\n            transaction.commit()?;\n            return Ok(rejected(SubmissionRejectionReason::WrongGeneration));\n        }\n\n        prune_tombstones(&transaction)?;\n        if exceeds_pending_bounds(&transaction, text_bytes, image_count, image_bytes)? {\n''',
          )

          pending_tests = "crates/talos-session/src/pending_submission/tests.rs"
          replace_exact(pending_tests, '        sender_generation: 3,\n', '        sender_generation: 0,\n')
          replace_exact(
              pending_tests,
              '''#[test]\nfn prestart_cancel_terminalizes_identity_without_provider_turn() {\n''',
              '''#[test]\nfn generation_advance_requires_quiescent_custody_and_rejects_fresh_stale_work() {\n    let dir = tempfile::tempdir().unwrap();\n    let store =\n        PendingSubmissionStore::for_session_file(&dir.path().join("session.tlog"), "session-1");\n    let retained = submission();\n    assert_eq!(\n        store.accept(&retained).unwrap().1,\n        SubmissionReceiptDisposition::AcceptedPending\n    );\n    assert!(matches!(\n        store.advance_runtime_generation(0),\n        Err(PendingSubmissionError::GenerationBusy {\n            generation: 0,\n            pending: 1,\n        })\n    ));\n    assert_eq!(store.runtime_generation().unwrap(), 0);\n\n    store.cancel_unstarted(&retained.id).unwrap();\n    assert_eq!(store.advance_runtime_generation(0).unwrap(), 1);\n\n    let mut stale = submission();\n    stale.id = "fresh-stale-batch".into();\n    stale.items[0].id = "fresh-stale-item".into();\n    assert_eq!(\n        store.accept(&stale).unwrap().1,\n        SubmissionReceiptDisposition::Rejected {\n            reason: SubmissionRejectionReason::WrongGeneration,\n        }\n    );\n    assert!(store.get(&stale.id).unwrap().is_none());\n\n    let mut current = stale;\n    current.id = "current-batch".into();\n    current.items[0].id = "current-item".into();\n    current.sender_generation = 1;\n    assert_eq!(\n        store.accept(&current).unwrap().1,\n        SubmissionReceiptDisposition::AcceptedPending\n    );\n}\n\n#[test]\nfn generation_fence_and_accept_are_serialized_across_store_instances() {\n    let dir = tempfile::tempdir().unwrap();\n    let session_file = dir.path().join("session.tlog");\n    let accept_store = PendingSubmissionStore::for_session_file(&session_file, "session-1");\n    let fence_store = PendingSubmissionStore::for_session_file(&session_file, "session-1");\n    let barrier = Arc::new(std::sync::Barrier::new(3));\n\n    let accept_barrier = barrier.clone();\n    let accept = std::thread::spawn(move || {\n        let payload = submission();\n        accept_barrier.wait();\n        accept_store.accept(&payload).unwrap().1\n    });\n    let fence_barrier = barrier.clone();\n    let fence = std::thread::spawn(move || {\n        fence_barrier.wait();\n        fence_store.advance_runtime_generation(0)\n    });\n    barrier.wait();\n\n    let disposition = accept.join().unwrap();\n    let advanced = fence.join().unwrap();\n    match (disposition, advanced) {\n        (\n            SubmissionReceiptDisposition::AcceptedPending,\n            Err(PendingSubmissionError::GenerationBusy {\n                generation: 0,\n                pending: 1,\n            }),\n        )\n        | (\n            SubmissionReceiptDisposition::Rejected {\n                reason: SubmissionRejectionReason::WrongGeneration,\n            },\n            Ok(1),\n        ) => {}\n        unexpected => panic!("accept/fence transaction escaped serialization: {unexpected:?}"),\n    }\n}\n\n#[test]\nfn prestart_cancel_terminalizes_identity_without_provider_turn() {\n''',
          )
          replace_exact(
              pending_tests,
              'use super::*;\n',
              'use std::sync::Arc;\n\nuse super::*;\n',
          )

          transition = "crates/talos-cli/src/session_transition.rs"
          replace_exact(
              transition,
              'use talos_agent::session::AppServerSession;\n',
              'use talos_agent::{PendingSchedulerActor, session::AppServerSession};\n',
          )
          replace_exact(
              transition,
              'use tokio::sync::mpsc;\n',
              'use tokio::sync::mpsc;\nuse tokio::task::JoinHandle;\nuse tokio_util::sync::CancellationToken;\n',
          )
          replace_exact(
              transition,
              '''\n    fn try_send(&self, operation: SessionOp) -> Result<(), mpsc::error::TrySendError<SessionOp>> {\n        self.sq_tx.try_send(operation)\n    }\n''',
              '',
          )
          replace_exact(
              transition,
              '''    /// Durable authoritative generation assigned to the replacement Actor.\n    pub generation: u64,\n''',
              '',
          )
          replace_exact(
              transition,
              '''struct PreparedSession {\n''',
              '''struct SchedulerRuntime {\n    cancel_token: CancellationToken,\n    join: JoinHandle<()>,\n}\n\nstruct PreparedSession {\n''',
          )
          replace_exact(
              transition,
              '''pub struct SessionTransition {\n    active_target: SessionCommandTarget,\n    active_session: Session,\n    prepared: Option<PreparedSession>,\n}\n''',
              '''pub struct SessionTransition {\n    active_target: SessionCommandTarget,\n    active_session: Session,\n    active_scheduler: Option<SchedulerRuntime>,\n    prepared: Option<PreparedSession>,\n}\n''',
          )
          replace_exact(
              transition,
              '''            active_target: SessionCommandTarget::new(sq_tx, generation),\n            active_session: session,\n            prepared: None,\n''',
              '''            active_target: SessionCommandTarget::new(sq_tx, generation),\n            active_session: session,\n            active_scheduler: None,\n            prepared: None,\n''',
          )
          replace_exact(
              transition,
              '''    pub fn active_generation(&self) -> u64 {\n        self.active_target.generation\n    }\n\n    pub fn prepare''',
              '''    pub fn active_generation(&self) -> u64 {\n        self.active_target.generation\n    }\n\n    /// Creates the production command route for the current exact Actor.\n    #[must_use]\n    pub fn bind_active_sender(&self) -> mpsc::Sender<SessionOp> {\n        self.active_target.bind_sender()\n    }\n\n    /// Starts and retains the Scheduler paired with the current Actor generation.\n    pub fn start_active_scheduler(\n        &mut self,\n        pending_scheduler: PendingSchedulerActor,\n    ) -> Result<(), String> {\n        if self.active_scheduler.is_some() {\n            return Err("the active Session Scheduler is already running".to_string());\n        }\n        let cancel_token = CancellationToken::new();\n        let join = pending_scheduler.spawn(\n            self.active_target.bind_sender(),\n            self.active_generation(),\n            cancel_token.clone(),\n        );\n        self.active_scheduler = Some(SchedulerRuntime { cancel_token, join });\n        Ok(())\n    }\n\n    pub fn prepare''',
          )
          text = read(transition)
          start = text.index('    /// Commits one Actor replacement and assigns its authoritative generation')
          end = text.index('    pub fn rollback(&mut self)', start)
          replacement = '''    /// Commits one Actor replacement with a durable generation fence.\n    ///\n    /// For a replacement of the same logical Session, journal admission and\n    /// generation advancement are serialized in one SQLite transaction. A\n    /// successful fence makes every fresh generation-G submission stale before\n    /// the old Scheduler and Actor are retired. The generation-G+1 Actor is not\n    /// spawned or published until the old command receiver has closed.\n    pub async fn commit(\n        &mut self,\n        mut actor: AppServerSession,\n        pending_scheduler: PendingSchedulerActor,\n    ) -> Result<CommitResult, String> {\n        let prepared = self\n            .prepared\n            .as_ref()\n            .ok_or_else(|| "no prepared transition to commit".to_string())?;\n        let same_logical_session = prepared.session.id == self.active_session.id;\n        let pending_store = PendingSubmissionStore::for_session(&prepared.session);\n        let next_generation = if same_logical_session {\n            pending_store\n                .advance_runtime_generation(self.active_generation())\n                .map_err(|error| format!("failed to fence Session runtime generation: {error}"))?\n        } else {\n            pending_store.runtime_generation().map_err(|error| {\n                format!("failed to load target Session runtime generation: {error}")\n            })?\n        };\n        let mut prepared = self\n            .prepared\n            .take()\n            .ok_or_else(|| "prepared transition disappeared during commit".to_string())?;\n\n        self.retire_active_runtime().await;\n\n        actor.set_generation(next_generation);\n        tokio::spawn(async move { actor.run().await });\n\n        let new_target = SessionCommandTarget::new(prepared.handle.sq_tx.clone(), next_generation);\n        prepared.handle.sq_tx = new_target.bind_sender();\n        let cancel_token = CancellationToken::new();\n        let scheduler_join = pending_scheduler.spawn(\n            new_target.bind_sender(),\n            next_generation,\n            cancel_token.clone(),\n        );\n        self.active_scheduler = Some(SchedulerRuntime {\n            cancel_token,\n            join: scheduler_join,\n        });\n        self.active_target = new_target;\n        let old_session = std::mem::replace(&mut self.active_session, prepared.session);\n\n        Ok(CommitResult {\n            old_session,\n            new_handle: prepared.handle,\n        })\n    }\n\n    async fn retire_active_runtime(&mut self) {\n        if let Some(runtime) = self.active_scheduler.take() {\n            runtime.cancel_token.cancel();\n            if let Err(error) = runtime.join.await {\n                tracing::warn!(%error, "retired Session Scheduler task did not join cleanly");\n            }\n        }\n\n        if self.active_target.sq_tx.send(SessionOp::Shutdown).await.is_ok() {\n            self.active_target.sq_tx.closed().await;\n        }\n    }\n\n'''
          write(transition, text[:start] + replacement + text[end:])
          replace_exact(
              transition,
              '''    #[test]\n    fn targeted_interrupt_generation_is_not_rewritten_by_proxy_binding() {\n''',
              '''    #[tokio::test]\n    async fn retirement_waits_through_a_full_queue_until_the_actor_receiver_closes() {\n        let temp = tempfile::tempdir().unwrap();\n        let manager = talos_session::SessionManager::with_dir(temp.path().join("sessions"));\n        let durable = manager\n            .create_or_open_session("i169-retirement-full-queue")\n            .unwrap();\n        let (sender, mut receiver) = mpsc::channel(1);\n        sender.send(SessionOp::Interrupt).await.unwrap();\n        let mut transition = SessionTransition::new(sender, durable.session().clone()).unwrap();\n\n        let receiver_task = tokio::spawn(async move {\n            assert!(matches!(receiver.recv().await, Some(SessionOp::Interrupt)));\n            tokio::time::sleep(std::time::Duration::from_millis(20)).await;\n            assert!(matches!(receiver.recv().await, Some(SessionOp::Shutdown)));\n            drop(receiver);\n        });\n\n        tokio::time::timeout(\n            std::time::Duration::from_secs(1),\n            transition.retire_active_runtime(),\n        )\n        .await\n        .expect("retirement must not discard Shutdown when the SQ is full");\n        receiver_task.await.unwrap();\n    }\n\n    #[test]\n    fn targeted_interrupt_generation_is_not_rewritten_by_proxy_binding() {\n''',
          )

          mode = "crates/talos-cli/src/mode_runners.rs"
          replace_exact(
              mode,
              '''    let (handle, mut actor) = AppServerSession::new(agent, session_config);\n''',
              '''    let (mut handle, mut actor) = AppServerSession::new(agent, session_config);\n''',
          )
          replace_exact(
              mode,
              '''    let transition_owner = SessionTransition::new(handle.sq_tx.clone(), session.clone())\n        .map_err(anyhow::Error::msg)?;\n''',
              '''    let mut transition_owner =\n        SessionTransition::new(handle.sq_tx.clone(), session.clone())\n            .map_err(anyhow::Error::msg)?;\n''',
          )
          replace_exact(
              mode,
              '''    actor.set_generation(session_generation);\n    let _sched_join = sched_pending.spawn(\n        handle.sq_tx.clone(),\n        session_generation,\n        tokio_util::sync::CancellationToken::new(),\n    );\n    let sq_tx_signal = handle.sq_tx.clone();\n    tokio::spawn(async move { actor.run().await });\n''',
              '''    actor.set_generation(session_generation);\n    tokio::spawn(async move { actor.run().await });\n    handle.sq_tx = transition_owner.bind_active_sender();\n    transition_owner\n        .start_active_scheduler(sched_pending)\n        .map_err(anyhow::Error::msg)?;\n    let sq_tx_signal = handle.sq_tx.clone();\n''',
          )

          handlers = "crates/talos-cli/src/session_handlers.rs"
          replace_exact(
              handlers,
              '''    match transition.commit(actor) {\n        Ok(result) => {\n            let _sched_join = sched_pending.spawn(\n                result.new_handle.sq_tx.clone(),\n                result.generation,\n                tokio_util::sync::CancellationToken::new(),\n            );\n''',
              '''    match transition.commit(actor, sched_pending).await {\n        Ok(result) => {\n''',
              expected=3,
          )

          lifecycle = "crates/talos-cli/src/model_lifecycle.rs"
          replace_exact(
              lifecycle,
              '''    match transition_guard.commit(actor) {\n        Ok(result) => {\n            let _sched_join = sched_pending.spawn(\n                result.new_handle.sq_tx.clone(),\n                result.generation,\n                tokio_util::sync::CancellationToken::new(),\n            );\n''',
              '''    match transition_guard.commit(actor, sched_pending).await {\n        Ok(result) => {\n''',
          )

          boundary = "crates/talos-agent/tests/i169_generation_boundary.rs"
          replace_exact(
              boundary,
              '''async fn receipt(receiver: &mut mpsc::UnboundedReceiver<SubmissionReceipt>) -> SubmissionReceipt {\n''',
              '''fn advance_store_to(store: &PendingSubmissionStore, generation: u64) {\n    for expected in 0..generation {\n        assert_eq!(store.advance_runtime_generation(expected).unwrap(), expected + 1);\n    }\n}\n\nasync fn receipt(receiver: &mut mpsc::UnboundedReceiver<SubmissionReceipt>) -> SubmissionReceipt {\n''',
          )
          text = read(boundary)
          first = text.index('async fn stale_generation_is_rejected_before_durable_or_provider_custody()')
          first_store = text.index('    let calls = Arc::new(AtomicUsize::new(0));', first)
          text = text[:first_store] + '    advance_store_to(&store, 5);\n' + text[first_store:]
          second = text.index('async fn user_and_scheduler_require_the_exact_authoritative_generation()')
          second_store = text.index('    let calls = Arc::new(AtomicUsize::new(0));', second)
          text = text[:second_store] + '    advance_store_to(&store, 9);\n' + text[second_store:]
          write(boundary, text)

          old_generation = "crates/talos-agent/tests/i169_old_generation_reconcile.rs"
          text = read(old_generation)
          start = text.index('#[tokio::test]\nasync fn generation_two_can_observe_but_never_execute_generation_one_custody()')
          end = text.index('#[tokio::test]\nasync fn process_reconstruction_rehydrates_generation_one_and_resumes_custody()', start)
          replacement = '''#[test]\nfn generation_advance_refuses_to_orphan_generation_one_custody() {\n    let temp = tempfile::tempdir().unwrap();\n    let manager = SessionManager::with_dir(temp.path().join("sessions"));\n    let durable = manager\n        .create_or_open_session("i169-cross-generation")\n        .unwrap();\n    let session_id = durable.id().to_string();\n    let store = PendingSubmissionStore::for_session_file(durable.file_path(), &session_id);\n    assert_eq!(store.advance_runtime_generation(0).unwrap(), 1);\n\n    let retained = submission("generation-one", 1, "must retain custody");\n    assert_eq!(\n        store.accept(&retained).unwrap().1,\n        SubmissionReceiptDisposition::AcceptedPending\n    );\n    assert_eq!(store.pause_unstarted().unwrap(), 1);\n    assert!(matches!(\n        store.advance_runtime_generation(1),\n        Err(talos_session::PendingSubmissionError::GenerationBusy {\n            generation: 1,\n            pending: 1,\n        })\n    ));\n    assert_eq!(store.runtime_generation().unwrap(), 1);\n\n    store.cancel_unstarted(&retained.id).unwrap();\n    assert_eq!(store.advance_runtime_generation(1).unwrap(), 2);\n    let stale = submission("late-generation-one", 1, "must reject after fence");\n    assert_eq!(\n        store.accept(&stale).unwrap().1,\n        SubmissionReceiptDisposition::Rejected {\n            reason: talos_core::session::SubmissionRejectionReason::WrongGeneration,\n        }\n    );\n    assert!(store.get(&stale.id).unwrap().is_none());\n}\n\n'''
          write(old_generation, text[:start] + replacement + text[end:])
          PY
      - name: Remove one-time workflow
        shell: bash
        run: rm .github/workflows/i169-generation-handoff-remediation.yml
      - name: Format and validate targeted remediation
        shell: bash
        run: |
          cargo fmt --all
          git diff --check
          cargo test -p talos-session pending_submission --locked
          cargo test -p talos-cli session_transition --locked
          cargo test -p talos-agent --test i169_generation_boundary --test i169_old_generation_reconcile --locked
      - name: Commit final remediation
        shell: bash
        run: |
          git config user.name "talos-remediation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(i169): fence generation handoff before runtime replacement"
          git push origin HEAD:feat/i169-tui-044-transactional-steering
