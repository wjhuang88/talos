name: I169 Agent Test Fix Apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Remove invalid set_persistence unwraps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/talos-agent/src/session/tests.rs")
          lines = path.read_text().splitlines(keepends=True)
          output = []
          count = 0
          for index, line in enumerate(lines):
              recent = lines[max(0, index - 20):index]
              if line.strip() == ".unwrap();" and any(
                  ".set_persistence(" in previous for previous in recent
              ):
                  if not output or output[-1].strip() != ")":
                      raise SystemExit("set_persistence unwrap is not preceded by a closing call")
                  newline = "\r\n" if output[-1].endswith("\r\n") else "\n"
                  output[-1] = output[-1].rstrip("\r\n") + ";" + newline
                  count += 1
                  continue
              output.append(line)
          if count != 5:
              raise SystemExit(f"expected 5 invalid set_persistence unwraps, found {count}")
          path.write_text("".join(output))
          PY
          rm -f .github/workflows/i169-agent-test-fix.yml
          rm -f .github/workflows/i169-test-api-fix.yml
          cargo fmt --all
          git diff --check
      - name: Compile affected test target
        shell: bash
        run: cargo test -p talos-agent --lib --no-run --locked
      - name: Commit agent test correction
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(i169): correct persistence test setup [model:GPT-5.6]"
          git push origin "HEAD:${HEAD_REF}"
