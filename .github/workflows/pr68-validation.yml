name: PR 68 validation

on:
  push:
    branches:
      - codex/issue-50-batched-steering-input
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[pr68-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-50-batched-steering-input
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fix one-shot delivery
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/talos-agent/src/scheduler.rs')
          text = path.read_text()
          old = '''            match sq_tx.try_send(scheduled_submission(&task_id_for_fire, labeled_for_fire)) {
                Ok(()) => {}
                Err(tokio::sync::mpsc::error::TrySendError::Full(_)) => {
                    tracing::warn!(
                        task_id = %task_id_for_fire,
                        "scheduled follow-up dropped: bounded session queue is full"
                    );
                }
                Err(tokio::sync::mpsc::error::TrySendError::Closed(_)) => {
                    tracing::debug!(
                        task_id = %task_id_for_fire,
                        "scheduled follow-up fire: session queue closed"
                    );
                }
            }
            let _ = fired_tx.send(task_id_for_fire);
'''
          new = '''            if sq_tx
                .send(scheduled_submission(&task_id_for_fire, labeled_for_fire))
                .await
                .is_err()
            {
                tracing::debug!(
                    task_id = %task_id_for_fire,
                    "scheduled follow-up fire: session queue closed before delivery"
                );
            }
            let _ = fired_tx.send(task_id_for_fire);
'''
          if text.count(old) != 1:
              raise SystemExit('expected one exact one-shot delivery block')
          path.write_text(text.replace(old, new, 1))
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Targeted tests
        run: cargo test -p talos-core -p talos-agent -p talos-cli --locked
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/talos-agent/src/scheduler.rs
          git commit -m 'fix(scheduler): wait for one-shot queue capacity [pr68-fix]'
          git push origin HEAD:codex/issue-50-batched-steering-input
