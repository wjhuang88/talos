name: I314 security fix validation (temporary)
on:
  push:
    branches:
      - tmp/i314-security-fix-validation-20261104
permissions:
  contents: write
jobs:
  security-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/i314-security-fix-validation-20261104
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format and commit code only to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git add crates/talos-tools/src/search_backend/production.rs \
            crates/talos-tools/src/search_backend/transport.rs \
            crates/talos-tools/src/search_backend/transport/tests.rs \
            crates/talos-tools/src/web_search.rs
          if ! git diff --cached --quiet; then
            git -c user.name='I314 Format Bot' -c user.email='i314-format@users.noreply.github.com' \
              commit -m 'style(search): format I314 security correction [skip ci]'
            git push origin HEAD:refs/heads/tmp/i314-security-fix-validation-20261104
          fi
          cargo fmt --all -- --check
      - name: Focused protected search and legacy compatibility tests
        run: cargo test -p talos-tools --locked --lib
      - name: Workspace Clippy
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Config compatibility tests
        run: cargo test -p talos-config --locked --lib
