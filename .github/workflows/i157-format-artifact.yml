name: I157 Branch Rustfmt

on:
  push:
    branches:
      - fix/i157-finalization-durability

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i157-finalization-durability
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Format sources
        run: cargo fmt --all
      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/talos-config/src/store.rs \
            crates/talos-config/src/store/fs.rs \
            crates/talos-config/src/store/journal.rs \
            crates/talos-config/src/store/recovery.rs \
            crates/talos-config/src/store_finalization_tests.rs \
            crates/talos-cli/tests/config_unset_finalization.rs
          git commit -m "style: apply rustfmt to I157 finalization changes"
          git push origin HEAD:fix/i157-finalization-durability
