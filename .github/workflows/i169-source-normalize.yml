name: I169 source normalization

on:
  push:
    branches:
      - feat/i169-tui-044-transactional-steering
    paths:
      - .github/workflows/i169-source-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - name: Materialize reviewed generated sources
        shell: bash
        run: |
          set -euo pipefail
          generated="$PWD/.i169-generated"
          mkdir -p "$generated"
          rustc crates/talos-cli/build.rs -o /tmp/i169-source-generator
          (
            cd crates/talos-cli
            OUT_DIR="$generated" /tmp/i169-source-generator
          )
          cp "$generated/tui_bridge_impl.rs" crates/talos-cli/src/tui_bridge.rs
          cp "$generated/tests_impl.rs" crates/talos-cli/src/tests.rs
          rm -rf "$generated"
          rm crates/talos-cli/build.rs
          rm crates/talos-cli/src/tui_bridge_impl.rs
          rm crates/talos-cli/src/tests_impl.rs

      - name: Remove delimiter-authoritative compatibility API and tests
        shell: python
        run: |
          import re
          from pathlib import Path

          engine_path = Path("crates/talos-conversation/src/engine.rs")
          engine = engine_path.read_text()
          old_doc = '''    /// Drains the oldest steering message while preserving FIFO order.
    ///
    /// This method remains available for downstream callers that need the
    /// original single-item behavior. Talos's interactive runtime uses
    /// [`Self::drain_steering_queue_batched`] for TUI-041 / GitHub Issue #50.
'''
          new_doc = '''    /// Drains the oldest steering message while preserving FIFO order.
    ///
    /// This method remains available only for legacy single-item callers.
    /// Transactional TUI steering uses structured prepare/commit/rollback.
'''
          old_batch = '''
    /// Drains the entire steering queue into a single batched message (TUI-041).
    ///
    /// When multiple user inputs accumulate in the steering queue during an
    /// active turn, this method joins them with `\\n\\n` separators so they are
    /// processed as one consolidated user turn instead of N sequential turns.
    /// Returns `None` when the queue is empty.
    pub fn drain_steering_queue_batched(&mut self) -> Option<String> {
        if self.steering_queue.is_empty() {
            None
        } else {
            self.prepared_steering = None;
            let joined = std::mem::take(&mut self.steering_queue)
                .into_iter()
                .map(|item| item.text)
                .collect::<Vec<_>>()
                .join("\\n\\n");
            Some(joined)
        }
    }
'''
          if engine.count(old_doc) != 1:
              raise SystemExit("expected exactly one legacy drain doc block")
          if engine.count(old_batch) != 1:
              raise SystemExit("expected exactly one delimiter batch method")
          engine = engine.replace(old_doc, new_doc, 1).replace(old_batch, "", 1)
          if "drain_steering_queue_batched" in engine:
              raise SystemExit("delimiter batch API remains in engine source")
          engine_path.write_text(engine)

          tests_path = Path("crates/talos-conversation/src/engine_tests.rs")
          tests = tests_path.read_text()
          tests = tests.replace(
              "// drain_steering_queue / drain_steering_queue_batched",
              "// drain_steering_queue / structured steering transaction",
              1,
          )
          tests = tests.replace(
              '''    assert_eq!(
        engine.drain_steering_queue_batched(),
        Some("queued".to_string())
    );''',
              '''    assert_eq!(engine.drain_steering_queue(), Some("queued".to_string()));''',
              1,
          )

          for name in (
              "drain_steering_queue_batched_joins_all_with_separator",
              "drain_steering_queue_batched_single_message",
              "drain_steering_queue_batched_none_when_empty",
          ):
              pattern = rf"\n#\[test\]\nfn {name}\(\) \{{.*?\n\}}\n"
              tests, count = re.subn(pattern, "\n", tests, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f"expected exactly one obsolete test {name}")

          old_snapshot = '''    let drained = engine.drain_steering_queue_batched();
    assert_eq!(drained, Some("first\\n\\nsecond".to_string()));

    let snap = engine.steering_queue_snapshot();
    assert_eq!(snap.total_count, 0);
    assert!(snap.entries.is_empty());'''
          new_snapshot = '''    let drained = engine.drain_steering_queue();
    assert_eq!(drained, Some("first".to_string()));

    let snap = engine.steering_queue_snapshot();
    assert_eq!(snap.total_count, 1);
    assert_eq!(snap.entries.len(), 1);
    assert_eq!(snap.entries[0].text, "second");'''
          if tests.count(old_snapshot) != 1:
              raise SystemExit("expected exactly one legacy snapshot drain assertion")
          tests = tests.replace(old_snapshot, new_snapshot, 1)
          if "drain_steering_queue_batched" in tests:
              raise SystemExit("delimiter batch references remain in Engine tests")
          tests_path.write_text(tests)

      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/i169-source-normalize.yml

      - name: Format and verify normalized sources
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check -p talos-conversation -p talos-cli --locked
          cargo test -p talos-conversation --locked

      - name: Commit normalized source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wjhuang88"
          git config user.email "6157210+wjhuang88@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(i169): materialize transactional bridge sources (#131) [model:gpt-5.6-thinking]"
          git push origin HEAD:feat/i169-tui-044-transactional-steering
