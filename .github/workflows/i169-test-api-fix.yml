name: I169 Test API Correction

on:
  pull_request:

permissions:
  contents: write

jobs:
  correct-test-api:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Align tests with in-place persistence API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/talos-agent/src/session/tests.rs")
          text = path.read_text()
          pattern = re.compile(
              r"(?ms)^    actor\n        \.set_persistence\(\n(.*?)^        \)\n        \.unwrap\(\);$"
          )
          replacement = r"    actor.set_persistence(\n\1        );"
          text, count = pattern.subn(replacement, text)
          if count != 5:
              raise SystemExit(f"expected five obsolete set_persistence unwraps, found {count}")
          path.write_text(text)
          PY
          rm -f .github/workflows/i169-test-api-fix.yml
          cargo fmt --all
          git diff --check
      - name: Compile and lint affected test target without cache
        shell: bash
        run: |
          set -euo pipefail
          unset RUSTC_WRAPPER
          rm -rf target
          cargo test -p talos-agent --lib --no-run --locked
          cargo clippy -p talos-agent --tests --locked -- -D warnings
      - name: Commit validated correction
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(i169): align tests with persistence API"
          git push origin "HEAD:${HEAD_REF}"
