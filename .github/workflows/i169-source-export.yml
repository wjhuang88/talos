name: I169 verified follow-up apply

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/i169-source-export.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Verify corrected patch transport
        shell: bash
        run: |
          set -euo pipefail
          wc -c .github/i169-followup2.patch.gz.b64.part*
          sha256sum .github/i169-followup2.patch.gz.b64.part*
          test "$(cat .github/i169-followup2.patch.gz.b64.part* | wc -c)" -eq 10348
          test "$(cat .github/i169-followup2.patch.gz.b64.part* | sha256sum | cut -d' ' -f1)" = "3fa50751220e22a2784a0a956aa8d033840869bc133728f246ee53bb1f1edec7"
          test "$(sha256sum .github/i169-followup2.patch.gz.b64.part00 | cut -d' ' -f1)" = "2a726e5be56f71c525d81ba4553a96f19e710d229b4368fbba00b0686c7fa0d7"
          test "$(sha256sum .github/i169-followup2.patch.gz.b64.part01 | cut -d' ' -f1)" = "80de1949822734447f624c04f436c4e45728711e2428d17e59a07e04a770ed5a"
          test "$(sha256sum .github/i169-followup2.patch.gz.b64.part02 | cut -d' ' -f1)" = "f78e0b77d78f73d50f2d49635abfab087d94a652d29bde4834ccdf82cbdd8863"
          test "$(sha256sum .github/i169-followup2.patch.gz.b64.part03 | cut -d' ' -f1)" = "00b8d43688da1a16fbe8aa4fadff06af2e47d8d825e86c99c0f2032a281e2077"
          test "$(sha256sum .github/i169-followup2.patch.gz.b64.part04 | cut -d' ' -f1)" = "f7294301e16aac6b1783c64cfba1d99950a0fc08b74a6e7644f084e972ff920f"
          test "$(sha256sum .github/i169-followup2.patch.gz.b64.part05a | cut -d' ' -f1)" = "5dfe695b54307f2277f898fcd02a040f9aec229c34c4562b148d8de533a8707a"
          test "$(sha256sum .github/i169-followup2.patch.gz.b64.part05b | cut -d' ' -f1)" = "048d9f2f640c339cb16742e803098316caf5c3d68cef18a31854632c92bdd306"
          test "$(wc -c < .github/i169-followup2-testfix.patch.gz.b64)" -eq 796
          test "$(sha256sum .github/i169-followup2-testfix.patch.gz.b64 | cut -d' ' -f1)" = "b090a02733e967a5acdc418e5767655d3edefed3f79c95317740eb8675ee0495"

      - name: Apply and format corrected follow-up
        shell: bash
        run: |
          set -euo pipefail
          cat .github/i169-followup2.patch.gz.b64.part* | base64 --decode | gzip --decompress > /tmp/i169-followup2.patch
          test "$(sha256sum /tmp/i169-followup2.patch | cut -d' ' -f1)" = "39e833b09a8074351f4e9ead8696f6db39d50b2cc307bac21b56cbfb83a206ac"
          git apply --index /tmp/i169-followup2.patch
          base64 --decode .github/i169-followup2-testfix.patch.gz.b64 | gzip --decompress > /tmp/i169-followup2-testfix.patch
          test "$(sha256sum /tmp/i169-followup2-testfix.patch | cut -d' ' -f1)" = "1f34e7b342f3513dfb344bbfd68e47fa025893ac7ce5c4f5daa79ed3ea0a6924"
          git apply --index /tmp/i169-followup2-testfix.patch
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} exact replacement(s), found {actual}"
                  )
              file.write_text(text.replace(old, new))

          replace_exact(
              "crates/talos-cli/src/session_handlers.rs",
              """        let hooks = build_hook_registry(true);
        let mcp_config = talos_config::McpConfig::default();
""",
              """        let hooks = build_hook_registry(true);
        let approval_handler = Arc::new(TuiApprovalHandler::new(
            ui_tx.clone(),
            dir.path().to_path_buf(),
        ));
        let runtime_builder = TuiRuntimeBuilder::new(
            ui_tx.clone(),
            hooks,
            dir.path().to_path_buf(),
            session_manager.clone(),
            approval_handler,
            Vec::new(),
            false,
            true,
        );
""",
          )
          replace_exact(
              "crates/talos-cli/src/session_handlers.rs",
              """        let result = handle_session_model(
            &transition,
            &ui_tx,
            &config,
            &hooks,
            dir.path(),
            &mcp_config,
            &session_watch_tx,
            &sq_tx_watch_tx,
            &bridge_rx_update_tx,
            &session_watch_rx,
            &session_manager,
            "o3@DEFAULT".to_string(),
            Some("openai".to_string()),
            true,
        )
""",
              """        let result = handle_session_model(
            &transition,
            &ui_tx,
            &config,
            &runtime_builder,
            &session_watch_tx,
            &sq_tx_watch_tx,
            &bridge_rx_update_tx,
            &session_watch_rx,
            "o3@DEFAULT".to_string(),
            Some("openai".to_string()),
        )
""",
          )

          replace_exact(
              "crates/talos-cli/src/mode_runners_tests.rs",
              """        let mcp_config = talos_config::McpConfig::default();
""",
              """        let approval_handler = Arc::new(TuiApprovalHandler::new(
            ui_tx.clone(),
            workspace.path().to_path_buf(),
        ));
        let runtime_builder = TuiRuntimeBuilder::new(
            ui_tx.clone(),
            hooks.clone(),
            workspace.path().to_path_buf(),
            session_manager.clone(),
            approval_handler,
            Vec::new(),
            false,
            true,
        );
""",
              expected=2,
          )
          replace_exact(
              "crates/talos-cli/src/mode_runners_tests.rs",
              """            handle_session_model(
                &transition,
                &ui_tx,
                &config,
                &hooks,
                workspace.path(),
                &mcp_config,
                &session_watch_tx,
                &sq_tx_watch_tx,
                &bridge_tx,
                &session_watch_rx,
                &session_manager,
                "target-model".to_string(),
                Some("target-gw".to_string()),
                true,
            ),
""",
              """            handle_session_model(
                &transition,
                &ui_tx,
                &config,
                &runtime_builder,
                &session_watch_tx,
                &sq_tx_watch_tx,
                &bridge_tx,
                &session_watch_rx,
                "target-model".to_string(),
                Some("target-gw".to_string()),
            ),
""",
          )
          replace_exact(
              "crates/talos-cli/src/mode_runners_tests.rs",
              """        let model_result = handle_session_model(
            &transition,
            &ui_tx,
            &config,
            &hooks,
            workspace.path(),
            &mcp_config,
            &session_watch_tx,
            &sq_tx_watch_tx,
            &bridge_tx,
            &session_watch_rx,
            &session_manager,
            "nonexistent-model".to_string(),
            Some("nonexistent-provider".to_string()),
            true,
        )
""",
              """        let model_result = handle_session_model(
            &transition,
            &ui_tx,
            &config,
            &runtime_builder,
            &session_watch_tx,
            &sq_tx_watch_tx,
            &bridge_tx,
            &session_watch_rx,
            "nonexistent-model".to_string(),
            Some("nonexistent-provider".to_string()),
        )
""",
          )

          replace_exact(
              "crates/talos-cli/src/model_lifecycle.rs",
              """    use talos_config::ProviderConfig;
""",
              """    use talos_agent::Agent;
    use talos_config::ProviderConfig;
""",
          )
          replace_exact(
              "crates/talos-cli/src/model_lifecycle.rs",
              """    use talos_session::{JsonlSessionStore, SessionEntry, SessionInfo, SessionStore};
""",
              """    use talos_session::{
        JsonlSessionStore, SessionEntry, SessionInfo, SessionManager, SessionStore,
    };
""",
          )
          PY
          cargo fmt --all
          git add -A
          cargo fmt --all -- --check
          git diff --cached --check

      - name: Workspace compile
        shell: bash
        run: cargo check --workspace --locked

      - name: Focused remediation tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p talos-agent configured_output_limit_above_4096_is_reserved_before_dispatch --locked
          cargo test -p talos-agent declared_image_size_is_conservatively_budgeted_before_dispatch --locked
          cargo test -p talos-agent multiple_declared_images_saturate_budget_instead_of_overflowing --locked
          cargo test -p talos-session --test i169_runtime_identity --locked
          cargo test -p talos-session runtime_activation_stage_is_generation_atomic_and_restart_recoverable --locked
          cargo test -p talos-cli publication_failure_stops_replacement_without_success --locked
          cargo test -p talos-cli session_owned_activation_survives_repeated_production_compaction --locked
          cargo test -p talos-cli --test i169_source_layout --locked

      - name: Strict Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Commit verified code and remove temporary facilities
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/i169-followup.patch.gz.b64.part* .github/i169-followup2.patch.gz.b64.part* .github/i169-followup2-testfix.patch.gz.b64 .github/workflows/i169-source-export.yml
          git diff --cached --check
          git config user.name "talos-governance-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test(i169): harden runtime reconstruction boundaries"
          git push origin HEAD:feat/i169-tui-044-transactional-steering
