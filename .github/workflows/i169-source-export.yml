name: I169 Remediation Apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Apply reviewed remediation
        shell: bash
        run: |
          set -euo pipefail
          for patch in .github/i169-patches/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          rm -rf .github/i169-patches
          rm -f .github/i169-remediation.part{1,2,3,4}
          rm -f .github/workflows/i169-source-export.yml
          cargo fmt --all
          git diff --check
      - name: Commit remediation
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(i169): address independent review blockers [model:GPT-5.6]"
          git push origin "HEAD:${HEAD_REF}"
