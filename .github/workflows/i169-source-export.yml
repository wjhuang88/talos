name: I169 Complete Remediation Apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Verify and apply complete remediation increment
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            6819e081ab52df0f005ccb463ac726adc9546e2f498c1831ada5d3d21e48bedb .github/i169-increment.part00 \
            8d22d28d8b10876d22391988c4973a2cb3af42ca3ac9e5a81d0fbc7cf10869e9 .github/i169-increment.part01 \
            468f9a71bbb05638b7858281a1f476f74f37507a150defb1d54d436d637e9189 .github/i169-increment.part02 \
            26efb0344db2d0bbfb5c54556c201a3ddd4a24d01ebc776822f93124e9bce58f .github/i169-increment.part03 \
            | sha256sum --check
          cat .github/i169-increment.part{00,01,02,03} > /tmp/i169.patch.gz.b64
          echo '0f0552166a5e40c6d329aed8bd7495ef4c795f5f45a5b847cd6f443bf1b1f07d  /tmp/i169.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/i169.patch.gz.b64 > /tmp/i169.patch.gz
          echo 'a57d902e6bcd0f9d51e93adac025d2bc4654da2df2ff56a366cf1f00db7db2c5  /tmp/i169.patch.gz' | sha256sum --check
          gzip --test /tmp/i169.patch.gz
          gzip --decompress --stdout /tmp/i169.patch.gz > /tmp/i169.patch
          echo '5f4b7030e1037af5ec3444246e0e3b972b74165437c6c8981eeebb470183c085  /tmp/i169.patch' | sha256sum --check
          git apply --check /tmp/i169.patch
          git apply /tmp/i169.patch
          rm -f .github/i169-increment.part{00,01,02,03}
          rm -f .github/workflows/i169-source-export.yml
          cargo fmt --all
          git diff --check
      - name: Commit complete remediation
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(i169): complete independent review remediation [model:GPT-5.6]"
          git push origin "HEAD:${HEAD_REF}"
