name: I169 Remediation Apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Apply reviewed remediation patch
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 --decode | gzip --decompress > /tmp/i169.patch
          git apply --check /tmp/i169.patch
          git apply /tmp/i169.patch
          cargo fmt --all
          git diff --check
          cargo check --workspace --locked
      - name: Commit formatted remediation
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(i169): address independent review blockers"
          git push origin "HEAD:${HEAD_REF}"
