name: I169 final remediation diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/i169-final-trigger.yml

permissions:
  contents: read

jobs:
  diagnose-reviewed-gate:
    if: github.event.pull_request.number == 131
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply reviewed remediation
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RUBY'
          workflow = YAML.load_file('.github/workflows/i169-source-verify2.yml')
          step = workflow.fetch('jobs').fetch('verify-and-publish').fetch('steps').find do |candidate|
            candidate['name'] == 'Apply reviewed remediation'
          end
          abort('reviewed remediation step not found') unless step && step['run']
          File.write('/tmp/i169-apply-reviewed-remediation.sh', "#!/usr/bin/env bash\nset -eo pipefail\n#{step.fetch('run')}\n")
          RUBY
          bash /tmp/i169-apply-reviewed-remediation.sh

      - name: Capture strict Clippy diagnostics
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee /tmp/i169-strict-clippy.log

      - name: Upload strict Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i169-strict-clippy-diagnostics
          path: /tmp/i169-strict-clippy.log
          if-no-files-found: error

      - name: Propagate strict Clippy result
        if: steps.clippy.outcome == 'failure'
        run: exit 1
