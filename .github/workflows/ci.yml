name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: i169-doc-eof-trim-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  trim-governance-doc-eof:
    if: github.event.pull_request.number == 131
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Trim only trailing blank lines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [
              'docs/backlog/active/TUI-044-transactional-batched-steering-turn.md',
              'docs/iterations/I169-batched-steering-turn.md',
              'docs/decisions/056-transactional-steering-submission-boundary.md',
          ]
          for name in files:
              path = Path(name)
              path.write_text(path.read_text().rstrip() + '\n')
          PY
          git diff --check

      - name: Commit three-document whitespace correction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            docs/backlog/active/TUI-044-transactional-batched-steering-turn.md \
            docs/iterations/I169-batched-steering-turn.md \
            docs/decisions/056-transactional-steering-submission-boundary.md; then
            echo 'Documents already have canonical EOF; no commit required.'
            exit 0
          fi
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base_commit = os.environ['BASE_COMMIT']
          branch = os.environ['HEAD_BRANCH']
          files = [
              'docs/backlog/active/TUI-044-transactional-batched-steering-turn.md',
              'docs/iterations/I169-batched-steering-turn.md',
              'docs/decisions/056-transactional-steering-submission-boundary.md',
          ]

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{path}',
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          commit = api('GET', f'git/commits/{base_commit}')
          entries = []
          for path in files:
              content = base64.b64encode(open(path, 'rb').read()).decode()
              blob = api('POST', 'git/blobs', {'content': content, 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = api('POST', 'git/trees', {'base_tree': commit['tree']['sha'], 'tree': entries})
          correction = api('POST', 'git/commits', {
              'message': 'docs(governance): normalize I169 evidence EOF',
              'tree': tree['sha'],
              'parents': [base_commit],
          })
          api('PATCH', f'git/refs/heads/{branch}', {'sha': correction['sha'], 'force': False})
          print(correction['sha'])
          PY
