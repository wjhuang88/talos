name: I169 final governance synchronization

on:
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact staged finalization
        shell: bash
        run: |
          test -f .github/i169_finalize_governance.py
          git merge-base --is-ancestor a476ed6b5d99012602a8ae980df1bea93fb8b930 HEAD

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Apply source cleanup and governance synchronization
        run: python3 .github/i169_finalize_governance.py

      - name: Restore persistent CI and validate finalization
        shell: bash
        run: |
          git show a476ed6b5d99012602a8ae980df1bea93fb8b930:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/i169_finalize_governance.py
          cargo fmt --all
          git diff --check
          cargo check -p talos-cli --locked
          cargo clippy -p talos-cli --locked -- -D warnings
          cargo test -p talos-cli session_transition --locked
          ./scripts/validate_project_governance.sh .
          ./scripts/validate_collaboration_claims.sh .

      - name: Commit with expected-head protection
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin feat/i169-tui-044-transactional-steering
          test "$(git rev-parse origin/feat/i169-tui-044-transactional-steering)" = "${EXPECTED_HEAD}"
          git config user.name "talos-remediation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs(i169): synchronize awaited handoff review evidence"
          git push origin HEAD:feat/i169-tui-044-transactional-steering
