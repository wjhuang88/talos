name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

env:
  CARGO_TERM_COLOR: always

jobs:
  classify-changes:
    name: Classify CI change scope
    runs-on: ubuntu-latest
    outputs:
      full_validation: ${{ steps.classify.outputs.full_validation }}
      reason: ${{ steps.classify.outputs.reason }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify from trusted target-branch policy
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "full_validation=true" >> "${GITHUB_OUTPUT}"
            echo "reason=non-pull-request event" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          classifier="$(mktemp)"
          classifier_output="$(mktemp)"
          if ! git show "${PR_BASE_SHA}:scripts/classify_ci_changes.py" > "${classifier}"; then
            echo "full_validation=true" >> "${GITHUB_OUTPUT}"
            echo "reason=classifier unavailable on trusted base" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if python3 "${classifier}" \
              --repo . \
              --base "${PR_BASE_SHA}" \
              --head "${PR_HEAD_SHA}" \
              --github-output "${classifier_output}"; then
            cat "${classifier_output}" >> "${GITHUB_OUTPUT}"
          else
            echo "full_validation=true" >> "${GITHUB_OUTPUT}"
            echo "reason=trusted classifier execution failed" >> "${GITHUB_OUTPUT}"
          fi

  preflight:
    name: Format + Check + Clippy + Test
    needs: classify-changes
    if: always()
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: GitHub Actions workflow inventory
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          unexpected="$(mktemp)"

          cat > "${expected}" <<'EOF'
          .github/workflows/actions-maintenance.yml
          .github/workflows/ci.yml
          .github/workflows/pages.yml
          .github/workflows/release.yml
          EOF

          find .github/workflows -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.yaml' \) \
            | sort > "${actual}"
          comm -13 "${expected}" "${actual}" > "${unexpected}"

          if [[ -s "${unexpected}" ]]; then
            echo "Unexpected GitHub Actions workflows are not allowed:" >&2
            cat "${unexpected}" >&2
            echo "Use an existing persistent workflow, a normal branch/PR, or repository scripts instead of a one-off workflow." >&2
            exit 1
          fi

      - name: Diff whitespace validation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
          fi
          if [[ -z "${base_sha}" || "${base_sha}" == "${zero_sha}" ]]; then
            base_sha="HEAD^"
          fi
          git diff --check "${base_sha}...HEAD"

      - name: Reduced documentation validation
        if: needs.classify-changes.result == 'success' && needs.classify-changes.outputs.full_validation == 'false'
        shell: bash
        run: |
          ./scripts/validate_public_site.sh
          ./scripts/validate_installers.sh
          ./scripts/validate_project_governance.sh .
          bash ./scripts/validate_collaboration_claims.sh .
          python3 ./scripts/test_ci_change_classifier.py

      - uses: dtolnay/rust-toolchain@master
        if: needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false'
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2
        if: needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false'

      - name: Release preflight
        if: needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false'
        run: ./scripts/release_preflight.sh

  windows-rust:
    name: Windows Rust workspace
    needs: classify-changes
    if: always() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Clippy workspace
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Focused PowerShell process, permission, and timeout tests
        run: |
          cargo test -p talos-tools --locked windows_spawned_powershell_child_cannot_observe_dangerous_parent_environment -- --nocapture
          cargo test -p talos-tools --locked platform_command_removes_dangerous_environment_variables -- --nocapture
          cargo test -p talos-tools --locked test_shell_template_rejects_cross_platform_path_expansion -- --nocapture
          cargo test -p talos-tools --locked continuous_output_does_not_reset_timeout_deadline -- --nocapture
          cargo test -p talos-tools --locked timeout_does_not_wait_for_descendant_pipe_eof -- --nocapture
          cargo test -p talos-tools --locked test_shell_metacharacters_pipe -- --nocapture

      - name: I170 exact-head Windows direct walkthrough
        shell: pwsh
        env:
          I170_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $log = "i170-windows-direct-walkthrough.log"
          "I170_WORKFLOW exact_head=${{ github.event.pull_request.head.sha || github.sha }}" | Tee-Object -FilePath $log
          "I170_WORKFLOW event_sha=${{ github.sha }}" | Tee-Object -FilePath $log -Append
          "I170_WORKFLOW checked_out_head=$(git rev-parse HEAD)" | Tee-Object -FilePath $log -Append
          "I170_WORKFLOW runner_os=$env:RUNNER_OS" | Tee-Object -FilePath $log -Append
          "I170_WORKFLOW runner_name=$env:RUNNER_NAME" | Tee-Object -FilePath $log -Append
          "I170_WORKFLOW runner_arch=$env:RUNNER_ARCH" | Tee-Object -FilePath $log -Append
          "I170_WORKFLOW image_os=$env:ImageOS" | Tee-Object -FilePath $log -Append
          "I170_WORKFLOW image_version=$env:ImageVersion" | Tee-Object -FilePath $log -Append
          cargo test -p talos-tools --locked windows_direct_powershell_walkthrough_records_exact_head_and_timeout_evidence -- --nocapture 2>&1 |
            Tee-Object -FilePath $log -Append
          $walkthroughExit = $LASTEXITCODE
          if ($walkthroughExit -ne 0) {
            exit $walkthroughExit
          }

      - name: Upload I170 Windows direct walkthrough
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i170-windows-direct-walkthrough-${{ github.event.pull_request.head.sha || github.sha }}
          path: i170-windows-direct-walkthrough.log
          if-no-files-found: warn
          retention-days: 14

      - name: Test workspace
        shell: pwsh
        run: |
          cargo test --workspace --locked --no-fail-fast 2>&1 | Tee-Object -FilePath windows-workspace-tests.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Write-Host "=== Windows workspace failure summary ==="
            Select-String -Path windows-workspace-tests.log -Pattern "FAILED|failures:|test result: FAILED|error: test failed|panicked at" -Context 3,8 |
              Tee-Object -FilePath windows-workspace-failures.log
            exit $testExit
          }

      - name: Upload Windows workspace failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-workspace-test-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            windows-workspace-failures.log
            windows-workspace-tests.log
          if-no-files-found: warn
          retention-days: 3

      - name: Validate project governance
        shell: pwsh
        run: ./scripts/validate_project_governance.ps1 .

      - name: Validate collaboration claims
        shell: bash
        run: ./scripts/validate_collaboration_claims.sh .

      - name: Rebuilt CLI mock smoke
        run: cargo run -p talos-cli --locked -- --mock --print --no-init --no-context "windows shell portability smoke"

  remote-governance-reconciliation:
    name: Remote issue / owner reconciliation
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate open Issue ownership and synchronization comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_remote_issue_owners.py

  windows-installer-fixture:
    name: Windows installer fixture
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: PowerShell installer fixture (offline)
        shell: pwsh
        run: ./scripts/install_fixtures.ps1
