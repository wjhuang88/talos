name: CI

on:
  pull_request:

permissions:
  contents: write
  issues: read

concurrency:
  group: i169-variant-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  i169-variant-activation-remediation:
    if: github.event.pull_request.number == 131
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Apply exact variant activation remediation
        shell: bash
        run: |
          set -euo pipefail
          reviewed_head="4e6404e60a5d8716581829bda761e7e77836d203"
          test "$(git merge-base "${reviewed_head}" HEAD)" = "${reviewed_head}"
          git show "${reviewed_head}:.github/workflows/ci.yml" > /tmp/i169-original-ci.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/i169_variant_activation_patch.py')
          text = path.read_text()
          old = '''    count = text.count(old)
              if count != 1:
          '''
          new = '''    count = text.count(old)
              if label == "normal model pass previous variant":
                  if count != 2:
                      raise SystemExit(f"{label}: expected exactly two matches, found {count}")
                  return text.replace(old, new, 1)
              if count != 1:
          '''
          if text.count(old) != 1:
              raise SystemExit('patch helper guard not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/i169_variant_activation_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/talos-cli/src/model_lifecycle.rs')
          text = path.read_text()
          old = 'use talos_session::{Session, SessionError, SessionManager, SessionMetadata};\n'
          new = 'use talos_session::{Session, SessionError, SessionManager};\n'
          if text.count(old) != 1:
              raise SystemExit('production SessionMetadata import not found exactly once')
          text = text.replace(old, new, 1)
          marker = '    use talos_session::{JsonlSessionStore, SessionEntry, SessionInfo, SessionStore};\n'
          replacement = '    use talos_session::{\n        JsonlSessionStore, SessionEntry, SessionInfo, SessionMetadata, SessionStore,\n    };\n'
          if text.count(marker) != 1:
              raise SystemExit('test talos_session import not found exactly once')
          path.write_text(text.replace(marker, replacement, 1))
          PY
          rm .github/i169_variant_activation_patch.py
          cp /tmp/i169-original-ci.yml .github/workflows/ci.yml
          cargo fmt --all

      - name: Focused model activation tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p talos-cli --locked model_switch_activation -- --nocapture
          cargo test -p talos-cli --locked session_activation -- --nocapture
          cargo test -p talos-cli --locked model_rebuild_history_is_read_only_after_old_runtime_quiesces -- --nocapture
          cargo test -p talos-cli --locked model_switch_marker_write_failure_stops_before_publication -- --nocapture
          cargo test -p talos-cli --test i169_source_layout --locked -- --nocapture

      - name: Compile and governance validation
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p talos-cli --locked
          cargo clippy -p talos-cli --locked -- -D warnings
          ./scripts/validate_collaboration_claims.sh .
          git diff --check 4e6404e60a5d8716581829bda761e7e77836d203...HEAD
          test ! -e .github/i169_variant_activation_patch.py
          test "$(git hash-object .github/workflows/ci.yml)" = "13c553cad99f9165dda24ab0259b36c5b3a7220c"

      - name: Commit validated remediation
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(tui): persist exact model activation identity"
          git push origin "HEAD:${HEAD_BRANCH}"
