name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: i169-runtime-projection-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  i169-runtime-projection-remediation:
    if: github.event.pull_request.number == 131
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Apply exact runtime projection remediation
        shell: bash
        run: |
          set -euo pipefail
          reviewed_head="bb835b0525da68273739198bb4cc5afc546adab4"
          test "$(git merge-base "${reviewed_head}" HEAD)" = "${reviewed_head}"
          git show "${reviewed_head}:.github/workflows/ci.yml" > /tmp/i169-original-ci.yml
          python3 .github/i169_runtime_projection_patch.py
          rm .github/i169_runtime_projection_patch.py
          cp /tmp/i169-original-ci.yml .github/workflows/ci.yml
          cargo fmt --all

      - name: Focused runtime projection tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p talos-cli --locked provider_build_materializes_variant_reasoning_into_real_request -- --nocapture
          cargo test -p talos-cli --locked provider_build_normalizes_default_to_baseline_request_options -- --nocapture
          cargo test -p talos-cli --locked provider_build_uses_safe_fallback_for_unknown_variant -- --nocapture
          cargo test -p talos-cli --locked session_activation_restores_exact_variant_and_reasoning_options -- --nocapture
          cargo test -p talos-cli --locked unknown_persisted_variant_restores_identity_but_uses_safe_fallback -- --nocapture
          cargo test -p talos-cli --locked normalized_default_model_selection_is_a_true_noop -- --nocapture
          cargo test -p talos-cli --locked model_switch_activation -- --nocapture
          cargo test -p talos-cli --test i169_source_layout --locked -- --nocapture

      - name: Compile and governance validation
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p talos-cli --locked
          cargo clippy -p talos-cli --locked -- -D warnings
          bash scripts/validate_collaboration_claims.sh .
          files=(
            crates/talos-cli/src/model_lifecycle.rs
            crates/talos-cli/src/provider_setup.rs
            crates/talos-cli/src/mode_runtime.rs
            crates/talos-cli/src/session_handlers.rs
            crates/talos-cli/tests/i169_source_layout.rs
            docs/backlog/active/TUI-044-transactional-batched-steering-turn.md
            docs/iterations/I169-batched-steering-turn.md
            docs/decisions/056-transactional-steering-submission-boundary.md
          )
          git diff --check bb835b0525da68273739198bb4cc5afc546adab4 -- "${files[@]}"
          test ! -e .github/i169_runtime_projection_patch.py
          test "$(git hash-object .github/workflows/ci.yml)" = "13c553cad99f9165dda24ab0259b36c5b3a7220c"

      - name: Create validated product commit through Git Data API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base_commit = os.environ['BASE_COMMIT']
          branch = os.environ['HEAD_BRANCH']
          files = [
              'crates/talos-cli/src/model_lifecycle.rs',
              'crates/talos-cli/src/provider_setup.rs',
              'crates/talos-cli/src/mode_runtime.rs',
              'crates/talos-cli/src/session_handlers.rs',
              'crates/talos-cli/tests/i169_source_layout.rs',
              'docs/backlog/active/TUI-044-transactional-batched-steering-turn.md',
              'docs/iterations/I169-batched-steering-turn.md',
              'docs/decisions/056-transactional-steering-submission-boundary.md',
          ]

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{path}',
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          commit = api('GET', f'git/commits/{base_commit}')
          entries = []
          for path in files:
              content = base64.b64encode(open(path, 'rb').read()).decode()
              blob = api('POST', 'git/blobs', {'content': content, 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})

          tree = api('POST', 'git/trees', {'base_tree': commit['tree']['sha'], 'tree': entries})
          product_commit = api('POST', 'git/commits', {
              'message': 'fix(cli): materialize persisted model variants at runtime',
              'tree': tree['sha'],
              'parents': [base_commit],
          })
          api('PATCH', f'git/refs/heads/{branch}', {'sha': product_commit['sha'], 'force': False})
          print(product_commit['sha'])
          PY
