name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: i169-variant-git-data-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  i169-variant-activation-commit:
    if: github.event.pull_request.number == 131 && github.sha == '1311a9036d3148edeedf78e220ef6021149f699f'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Apply exact variant activation remediation
        shell: bash
        run: |
          set -euo pipefail
          reviewed_head="4e6404e60a5d8716581829bda761e7e77836d203"
          test "$(git merge-base "${reviewed_head}" HEAD)" = "${reviewed_head}"
          git show "${reviewed_head}:.github/workflows/ci.yml" > /tmp/i169-original-ci.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/i169_variant_activation_patch.py')
          text = path.read_text()
          old = '''    count = text.count(old)
              if count != 1:
          '''
          new = '''    count = text.count(old)
              if label == "normal model pass previous variant":
                  if count != 2:
                      raise SystemExit(f"{label}: expected exactly two matches, found {count}")
                  return text.replace(old, new, 1)
              if count != 1:
          '''
          if text.count(old) != 1:
              raise SystemExit('patch helper guard not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/i169_variant_activation_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/talos-cli/src/model_lifecycle.rs')
          text = path.read_text()
          old = 'use talos_session::{Session, SessionError, SessionManager, SessionMetadata};\n'
          new = 'use talos_session::{Session, SessionError, SessionManager};\n#[cfg(test)]\nuse talos_session::SessionMetadata;\n'
          if text.count(old) != 1:
              raise SystemExit('production SessionMetadata import not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/i169_variant_activation_patch.py
          cp /tmp/i169-original-ci.yml .github/workflows/ci.yml
          cargo fmt --all

      - name: Validate exact product files
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p talos-cli --locked model_switch_activation -- --nocapture
          cargo test -p talos-cli --locked session_activation -- --nocapture
          cargo test -p talos-cli --locked model_rebuild_history_is_read_only_after_old_runtime_quiesces -- --nocapture
          cargo test -p talos-cli --locked model_switch_marker_write_failure_stops_before_publication -- --nocapture
          cargo test -p talos-cli --test i169_source_layout --locked -- --nocapture
          cargo check -p talos-cli --locked
          cargo clippy -p talos-cli --locked -- -D warnings
          bash scripts/validate_collaboration_claims.sh .
          git diff --check 4e6404e60a5d8716581829bda761e7e77836d203...HEAD
          test ! -e .github/i169_variant_activation_patch.py
          test "$(git hash-object .github/workflows/ci.yml)" = "13c553cad99f9165dda24ab0259b36c5b3a7220c"

      - name: Create seven-file product commit through Git Data API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base_commit = os.environ['BASE_COMMIT']
          branch = os.environ['HEAD_BRANCH']
          files = [
              'crates/talos-cli/src/model_lifecycle.rs',
              'crates/talos-cli/src/mode_runtime.rs',
              'crates/talos-cli/src/session_handlers.rs',
              'crates/talos-cli/tests/i169_source_layout.rs',
              'docs/backlog/active/TUI-044-transactional-batched-steering-turn.md',
              'docs/iterations/I169-batched-steering-turn.md',
              'docs/decisions/056-transactional-steering-submission-boundary.md',
          ]

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{path}',
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          commit = api('GET', f'git/commits/{base_commit}')
          tree_entries = []
          for path in files:
              content = base64.b64encode(open(path, 'rb').read()).decode()
              blob = api('POST', 'git/blobs', {'content': content, 'encoding': 'base64'})
              tree_entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})

          tree = api('POST', 'git/trees', {'base_tree': commit['tree']['sha'], 'tree': tree_entries})
          product_commit = api('POST', 'git/commits', {
              'message': 'fix(tui): persist exact model activation identity',
              'tree': tree['sha'],
              'parents': [base_commit],
          })
          api('PATCH', f'git/refs/heads/{branch}', {'sha': product_commit['sha'], 'force': False})
          print(product_commit['sha'])
          PY
