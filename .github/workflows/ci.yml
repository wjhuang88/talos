name: I169 awaited runtime handoff remediation

on:
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify protected remediation inputs
        shell: bash
        run: |
          git merge-base --is-ancestor 7cb52c8652c7c6593c1075cd0b3e8d61523cd4c0 HEAD
          test -f .github/i169-awaited-handoff-trigger
          test -f .github/i169_awaited_handoff_remediate.py

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Apply exact handoff remediation
        run: python3 .github/i169_awaited_handoff_remediate.py

      - name: Restore persistent CI and validate focused paths
        shell: bash
        run: |
          git show 7cb52c8652c7c6593c1075cd0b3e8d61523cd4c0:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/i169-awaited-handoff-trigger
          rm .github/i169_awaited_handoff_remediate.py
          cargo fmt --all
          git diff --check
          cargo check -p talos-cli --locked
          cargo test -p talos-session pending_submission --locked
          cargo test -p talos-cli session_transition --locked
          cargo test -p talos-agent --lib --locked
          cargo test -p talos-agent --test i169_generation_boundary --test i169_old_generation_reconcile --locked

      - name: Commit with expected-head protection
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin feat/i169-tui-044-transactional-steering
          test "$(git rev-parse origin/feat/i169-tui-044-transactional-steering)" = "${EXPECTED_HEAD}"
          git config user.name "talos-remediation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(i169): await actor and scheduler generation handoff"
          git push origin HEAD:feat/i169-tui-044-transactional-steering
