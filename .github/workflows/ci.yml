name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-i169-sqlite-remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Apply, format, restore CI, and commit
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python3 .github/i169_sqlite_busy_retry.py
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout b5bd3535d50c44e9aa100f1d629ad50faafe8458 -- .github/workflows/ci.yml
          git rm .github/i169_sqlite_busy_retry.py
          git add crates/talos-session/src/pending_submission.rs
          git commit -m "fix(session): retry SQLite journal setup contention"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
