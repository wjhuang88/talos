name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

env:
  CARGO_TERM_COLOR: always

jobs:
  classify-changes:
    name: Classify CI change scope
    runs-on: ubuntu-latest
    outputs:
      full_validation: ${{ steps.classify.outputs.full_validation }}
      reason: ${{ steps.classify.outputs.reason }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Classify from trusted target-branch policy
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "full_validation=true" >> "${GITHUB_OUTPUT}"
            echo "reason=non-pull-request event" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          classifier="$(mktemp)"
          classifier_output="$(mktemp)"
          if ! git show "${PR_BASE_SHA}:scripts/classify_ci_changes.py" > "${classifier}"; then
            echo "full_validation=true" >> "${GITHUB_OUTPUT}"
            echo "reason=classifier unavailable on trusted base" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if python3 "${classifier}" \
              --repo . \
              --base "${PR_BASE_SHA}" \
              --head "${PR_HEAD_SHA}" \
              --github-output "${classifier_output}"; then
            cat "${classifier_output}" >> "${GITHUB_OUTPUT}"
          else
            echo "full_validation=true" >> "${GITHUB_OUTPUT}"
            echo "reason=trusted classifier execution failed" >> "${GITHUB_OUTPUT}"
          fi

  preflight:
    name: Format + Check + Clippy + Test
    needs: classify-changes
    if: always()
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: GitHub Actions workflow inventory
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          unexpected="$(mktemp)"

          cat > "${expected}" <<'EOF'
          .github/workflows/actions-maintenance.yml
          .github/workflows/ci.yml
          .github/workflows/pages.yml
          .github/workflows/release.yml
          EOF

          find .github/workflows -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.yaml' \) \
            | sort > "${actual}"
          comm -13 "${expected}" "${actual}" > "${unexpected}"

          if [[ -s "${unexpected}" ]]; then
            echo "Unexpected GitHub Actions workflows are not allowed:" >&2
            cat "${unexpected}" >&2
            echo "Use an existing persistent workflow, a normal branch/PR, or repository scripts instead of a one-off workflow." >&2
            exit 1
          fi

      - name: Diff whitespace validation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
          fi
          if [[ -z "${base_sha}" || "${base_sha}" == "${zero_sha}" ]]; then
            base_sha="HEAD^"
          fi
          git diff --check "${base_sha}...HEAD"

      - name: Reduced documentation validation
        if: needs.classify-changes.result == 'success' && needs.classify-changes.outputs.full_validation == 'false'
        shell: bash
        run: |
          ./scripts/validate_public_site.sh
          ./scripts/validate_installers.sh
          ./scripts/validate_project_governance.sh .
          bash ./scripts/validate_collaboration_claims.sh .
          python3 ./scripts/test_ci_change_classifier.py

      - uses: dtolnay/rust-toolchain@master
        if: needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false'
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2
        if: needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false'

      - name: Release preflight
        if: needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false'
        run: ./scripts/release_preflight.sh

      - name: Pending-store permission-denial regression
        if: needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false'
        shell: bash
        run: |
          set -euo pipefail
          result_log="$(mktemp)"
          cargo test --locked -p talos-session --lib \
            pending_submission::tests::recovery_preserves_filesystem_permission_errors \
            -- --exact --nocapture 2>&1 | tee "${result_log}"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored' "${result_log}"
          grep -F 'pending-journal permission fixture filesystem_error=PermissionDenied' "${result_log}"

      - name: Real CLI and TUI Auto locale acceptance
        if: needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p talos-cli
          python3 scripts/accept_auto_locale.py target/debug/talos
          python3 scripts/accept_auto_locale_tui.py target/debug/talos

      - name: Optional language Plugin acceptance
        if: needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          rustup component add llvm-tools-preview
          if ! brew list --versions llvm >/dev/null 2>&1; then
            brew install llvm
          fi
          wasm_llvm_prefix=$(brew --prefix llvm)
          export CC_wasm32_unknown_unknown="$wasm_llvm_prefix/bin/clang"
          export AR_wasm32_unknown_unknown="$wasm_llvm_prefix/bin/llvm-ar"
          bash scripts/validate_language_plugins.sh

      - name: Fetch locked dependencies for offline all-feature audit
        if: needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false'
        timeout-minutes: 10
        # Default workspace builds do not fetch optional Desktop/all-target dependencies.
        run: cargo fetch --locked

      - name: Dependency audit parity (offline)
        if: needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false'
        run: bash scripts/test_dependency_audit.sh

      - name: Desktop explicit feature validation
        if: needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false'
        timeout-minutes: 20
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          set -euo pipefail
          unset RXCB_EXPORT RING_PREGENERATE_ASM
          cargo clippy -p talos-desktop --features desktop-ui --all-targets --locked -- -D warnings
          cargo test -p talos-desktop --features desktop-ui --locked

  windows-rust:
    name: Windows Rust workspace
    needs: classify-changes
    if: always() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false')
    runs-on: windows-latest
    # Cold validation can take 27 minutes; allow bounded cache post-job cleanup too.
    # Individual validation steps retain their own timeout limits.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2

      - name: Record native Git transport executables
        shell: pwsh
        run: |
          git version --build-options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gitExecPath = git --exec-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Git exec-path: $gitExecPath"
          foreach ($name in @('git.exe', 'git-receive-pack.exe', 'git-upload-pack.exe')) {
            $candidate = Join-Path $gitExecPath $name
            if (Test-Path -LiteralPath $candidate) {
              Get-Item -LiteralPath $candidate -ErrorAction Stop |
                Select-Object FullName, LinkType, Target
            } else {
              Write-Host "Git exec-path entry absent: $candidate"
            }
          }
          $transportShell = git var GIT_SHELL_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Git transport shell: $transportShell"
          Get-Command git, sh -CommandType Application | Select-Object Name, Source
          Get-Item -LiteralPath $transportShell -ErrorAction Stop |
            Select-Object FullName, LinkType, Target

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Clippy workspace
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Desktop explicit feature validation
        timeout-minutes: 20
        shell: pwsh
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          Remove-Item Env:RXCB_EXPORT -ErrorAction SilentlyContinue
          Remove-Item Env:RING_PREGENERATE_ASM -ErrorAction SilentlyContinue
          cargo clippy -p talos-desktop --features desktop-ui --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p talos-desktop --features desktop-ui --locked
          exit $LASTEXITCODE

      - name: Structured Git executable and path identity guard tests
        # Independent evidence must still run after a Desktop failure.
        # Earlier failures remain failures of the job.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $tests = @(
            'process_boundary::windows_foreground::tests::panicked_io_worker_never_confirms_cleanup',
            'process_boundary::windows_foreground::tests::ordinary_io_error_has_completed_resource_ownership',
            'process_boundary::windows_foreground::tests::dropped_reservation_is_sticky_but_other_operations_are_isolated',
            'process_boundary::windows_foreground::tests::foreground_finite_binary_input_reaches_eof_and_returns_exact_output',
            'process_boundary::windows_foreground::tests::foreground_large_input_drains_both_output_pipes_concurrently',
            'process_boundary::windows_foreground::tests::foreground_timeout_confirms_job_and_io_cleanup',
            'process_boundary::windows_foreground::tests::foreground_output_limit_terminates_writer_and_confirms_cleanup',
            'process_boundary::windows_foreground::tests::foreground_leader_exit_reaps_descendant_with_redirected_stdio',
            'process_boundary::windows_foreground::tests::dropped_foreground_wait_keeps_cleanup_owned',
            'process_boundary::windows_foreground::tests::cancelling_one_foreground_operation_preserves_another_live_job',
            'git::git_write::prepared_add::tests::windows_program_guard_allows_real_git_startup',
            'git::git_write::prepared_add::host_path::tests::explicit_git_directory_argument_preserves_canonical_identity',
            'git::git_write::prepared_add::host_path::tests::explicit_git_directory_arguments_run_native_git',
            'git::git_write::prepared_add::tests::program_evidence_retains_windows_replacement_guard',
            'git::git_write::prepared_add::tests::sender_program_binding_requires_new_exact_read_admission',
            'git::git_write::prepared_add::tests::sender_configuration_sources_remain_readable_after_rebinding',
            'git::git_write::prepared_add::tests::sender_program_binding_preserves_invocation_budget',
            'git::git_write::prepared_add::tests::windows_internal_program_report_matches_only_retained_canonical_spelling',
            'git::git_write::prepared_add::tests::internal_program_validation_distinguishes_unadmitted_path_from_target_drift',
            'git::git_write::prepared_add::tests::push_program_rebind_preserves_sender_effects_without_receiver_reads',
            'git::git_write::prepared_add::tests::push_program_rebind_rejects_changed_destination_plan',
            'git::git_write::snapshot::tests::path_identity_retains_leaf_and_ancestor_identity',
            'git::git_write::snapshot::tests::regular_evidence_rejects_identical_byte_inode_replacement',
            'git::git_write::prepared_add::tests::pull_command::native_command_refuses_frozen_invocation_substitution_before_fetch',
            'git::git_write::prepared_add::tests::pull_command::native_command_refuses_configuration_drift_before_fetch',
            'git::git_write::prepared_add::tests::exact_approved_plan_stages_selected_file',
            'git::git_write::prepared_add::tests::direct_and_forged_or_exchanged_proofs_cannot_stage',
            'git::git_write::prepared_add::tests::approval_is_bound_to_prepared_source_and_index',
            'git::git_write::prepared_add::tests::real_commit_preserves_index_semantics_and_all_excludes_untracked',
            'git::git_write::prepared_add::tests::commit_plan_binds_tracked_sources_and_rejects_add_proof',
            'git::git_write::prepared_add::tests::checkout_nonrecursive_gitlink_preserves_dirty_child_worktree',
            'git::git_write::prepared_add::tests::prepared_push_transfers_objects_with_explicit_sideband_disabled',
            'git::git_write::prepared_add::tests::checkout_ref_movement_after_discovery_invalidates_plan'
          )
          $listed = @(cargo test -p talos-tools --features git --locked --lib -- --list)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gateTests = @(cargo test -p talos-tools --features git --locked --test windows_git_preparation_gate -- --list)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($gateTests -notcontains 'production_prepared_add_requires_proof_and_stages_exact_path: test') {
            throw 'Required production Windows prepared Add execution regression is missing'
          }
          cargo test -p talos-tools --features git --locked --test windows_git_preparation_gate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p talos-runtime --locked --test i300_native_pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p talos-mcp --locked --test git_pull_prepared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in $tests) {
            if ($listed -notcontains "${test}: test") {
              throw "Required Windows Git regression is missing: $test"
            }
            cargo test -p talos-tools --features git --locked --lib $test -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Focused PowerShell process, permission, and timeout tests
        run: |
          cargo test -p talos-tools --locked windows_spawned_powershell_child_cannot_observe_dangerous_parent_environment -- --nocapture
          cargo test -p talos-tools --locked platform_command_removes_dangerous_environment_variables -- --nocapture
          cargo test -p talos-tools --locked test_shell_template_rejects_cross_platform_path_expansion -- --nocapture
          cargo test -p talos-tools --locked continuous_output_does_not_reset_timeout_deadline -- --nocapture
          cargo test -p talos-tools --locked timeout_does_not_wait_for_descendant_pipe_eof -- --nocapture
          cargo test -p talos-tools --locked test_shell_metacharacters_pipe -- --nocapture

      - name: I170 exact-head Windows direct walkthrough
        shell: pwsh
        env:
          I170_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $log = "i170-windows-direct-walkthrough.log"
          "I170_WORKFLOW exact_head=${{ github.event.pull_request.head.sha || github.sha }}" | Tee-Object -FilePath $log
          "I170_WORKFLOW event_sha=${{ github.sha }}" | Tee-Object -FilePath $log -Append
          "I170_WORKFLOW checked_out_head=$(git rev-parse HEAD)" | Tee-Object -FilePath $log -Append
          "I170_WORKFLOW runner_os=$env:RUNNER_OS" | Tee-Object -FilePath $log -Append
          "I170_WORKFLOW runner_name=$env:RUNNER_NAME" | Tee-Object -FilePath $log -Append
          "I170_WORKFLOW runner_arch=$env:RUNNER_ARCH" | Tee-Object -FilePath $log -Append
          "I170_WORKFLOW image_os=$env:ImageOS" | Tee-Object -FilePath $log -Append
          "I170_WORKFLOW image_version=$env:ImageVersion" | Tee-Object -FilePath $log -Append
          cargo test -p talos-tools --locked windows_direct_powershell_walkthrough_records_exact_head_and_timeout_evidence -- --nocapture 2>&1 |
            Tee-Object -FilePath $log -Append
          $walkthroughExit = $LASTEXITCODE
          if ($walkthroughExit -ne 0) {
            exit $walkthroughExit
          }

      - name: Upload I170 Windows direct walkthrough
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i170-windows-direct-walkthrough-${{ github.event.pull_request.head.sha || github.sha }}
          path: i170-windows-direct-walkthrough.log
          if-no-files-found: warn
          retention-days: 14

      - name: Test workspace
        # Preserve cross-crate evidence after an independent Desktop/guard failure.
        # This does not suppress the earlier failure or run after cancellation.
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: pwsh
        run: |
          # I302: installed-file identities, not loaded-process/module observations.
          # Keep the original tests running even if identity collection is incomplete.
          $moduleEvidenceComplete = $true
          foreach ($moduleName in @('kernelbase.dll', 'kernel32.dll', 'ntdll.dll')) {
            $stream = $null
            $hash = $null
            $record = @{ file = $moduleName; phase = 'before_workspace_tests'; status = 'incomplete' }
            try {
              $modulePath = [IO.Path]::Combine([Environment]::SystemDirectory, $moduleName)
              if (([IO.File]::GetAttributes($modulePath) -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw 'unsupported file'
              }
              $stream = [IO.File]::Open($modulePath, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read)
              $limit = 32MB
              if ($stream.Length -le 0 -or $stream.Length -ge $limit) { throw 'size limit' }
              $expectedLength = $stream.Length
              $hash = [Security.Cryptography.SHA256]::Create()
              $buffer = [byte[]]::new(16384)
              $header = [byte[]]::new(4096)
              $headerCount = 0
              $total = 0L
              while ($total -lt $limit) {
                $count = $stream.Read($buffer, 0, [int][Math]::Min($buffer.Length, $limit - $total))
                if ($count -eq 0) { break }
                $copyCount = [int][Math]::Min($count, $header.Length - $headerCount)
                if ($copyCount -gt 0) {
                  [Array]::Copy($buffer, 0, $header, $headerCount, $copyCount)
                  $headerCount += $copyCount
                }
                $null = $hash.TransformBlock($buffer, 0, $count, $buffer, 0)
                $total += $count
              }
              if ($total -ge $limit -or $total -ne $expectedLength -or $stream.Length -ne $expectedLength) {
                throw 'incomplete identity'
              }
              $null = $hash.TransformFinalBlock([byte[]]::new(0), 0, 0)
              # Decode only the symbol-store lookup fields from the hashed prefix.
              if ($headerCount -lt 64 -or [BitConverter]::ToUInt16($header, 0) -ne 0x5a4d) {
                throw 'unsupported DOS header'
              }
              $pe = [BitConverter]::ToInt32($header, 60)
              if ($pe -lt 64 -or $pe -gt $headerCount - 88) { throw 'PE header outside prefix' }
              if ([BitConverter]::ToUInt32($header, $pe) -ne 0x4550 -or
                  [BitConverter]::ToUInt16($header, $pe + 4) -ne 0x8664) { throw 'unsupported PE header' }
              $optionalSize = [BitConverter]::ToUInt16($header, $pe + 20)
              if ($optionalSize -lt 112 -or $optionalSize -gt $headerCount - $pe - 24 -or
                  [BitConverter]::ToUInt16($header, $pe + 24) -ne 0x20b) { throw 'unsupported optional header' }
              $imageSize = [BitConverter]::ToUInt32($header, $pe + 80)
              if ($imageSize -eq 0 -or $imageSize -gt 0x80000000L) { throw 'unsupported image size' }
              $record = @{
                file = $moduleName; phase = 'before_workspace_tests'; status = 'ok'; bytes = $total
                sha256 = [BitConverter]::ToString($hash.Hash).Replace('-', '').ToLowerInvariant()
                pe_timestamp = [BitConverter]::ToUInt32($header, $pe + 8); image_size = $imageSize
              }
            } catch {
              # Do not disclose paths, exception bodies, bytes or environment contents.
              $moduleEvidenceComplete = $false
            } finally {
              foreach ($resource in @($hash, $stream)) {
                try {
                  if ($null -ne $resource) { $resource.Dispose() }
                } catch {
                  $moduleEvidenceComplete = $false
                  $record = @{ file = $moduleName; phase = 'before_workspace_tests'; status = 'incomplete' }
                }
              }
            }
            Write-Host ('I302_INSTALLED_MODULE ' + ($record | ConvertTo-Json -Compress))
          }
          # Preserve panic diagnostics even if a later test hangs until the step timeout.
          # I300: distinguish live Cargo/test processes from inherited output handles
          # after Cargo prints its final summary. No command lines or environment values.
          $processLog = Join-Path $PWD 'windows-workspace-processes.jsonl'
          $observer = Start-Job -ArgumentList $processLog -ScriptBlock {
            param($logPath)
            for ($sample = 0; $sample -lt 20; $sample++) {
              try {
                $processes = @(Get-CimInstance Win32_Process -OperationTimeoutSec 5 |
                  Select-Object -First 256 Name, ProcessId, ParentProcessId, HandleCount, ThreadCount, CreationDate)
                @{ utc = [DateTime]::UtcNow.ToString('o'); sample = $sample; processes = $processes } |
                  ConvertTo-Json -Depth 4 -Compress | Add-Content -LiteralPath $logPath
              } catch {
                @{ utc = [DateTime]::UtcNow.ToString('o'); sample = $sample; status = 'observation_failed' } |
                  ConvertTo-Json -Compress | Add-Content -LiteralPath $logPath
              }
              Start-Sleep -Seconds 60
            }
          }
          try {
            cargo test --workspace --locked --no-fail-fast -- --nocapture 2>&1 | Tee-Object -FilePath windows-workspace-tests.log
            $testExit = $LASTEXITCODE
          } finally {
            Stop-Job -Job $observer -ErrorAction SilentlyContinue
            Remove-Job -Job $observer -Force -ErrorAction SilentlyContinue
          }
          if ($testExit -ne 0) {
            Write-Host "=== Windows workspace failure summary ==="
            Select-String -Path windows-workspace-tests.log -Pattern "FAILED|failures:|test result: FAILED|error: test failed|panicked at" -Context 3,8 |
              Tee-Object -FilePath windows-workspace-failures.log
            exit $testExit
          }
          if (-not $moduleEvidenceComplete) {
            Write-Host 'I302 installed-module identity incomplete; workspace tests were still attempted.'
            exit 1
          }

      - name: Upload Windows workspace failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-workspace-test-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            windows-workspace-failures.log
            windows-workspace-tests.log
            windows-workspace-processes.jsonl
          if-no-files-found: warn
          retention-days: 3

      - name: Validate project governance
        shell: pwsh
        run: ./scripts/validate_project_governance.ps1 .

      - name: Fetch locked dependencies for offline all-feature audit
        timeout-minutes: 10
        run: cargo fetch --locked

      - name: Native PowerShell dependency audit (offline)
        shell: pwsh
        run: ./scripts/test_dependency_windows.ps1 -Workspace

      - name: Validate collaboration claims
        shell: bash
        run: ./scripts/validate_collaboration_claims.sh .

      - name: Rebuilt CLI mock smoke
        run: cargo run -p talos-cli --locked -- --mock --print --no-init --no-context "windows shell portability smoke"

  linux-desktop:
    name: Linux Desktop explicit feature
    needs: classify-changes
    if: always() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.full_validation != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Native display and font development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libfontconfig1-dev libfreetype6-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libvulkan-dev
      - name: Desktop explicit feature validation
        shell: bash
        run: |
          set -euo pipefail
          unset RXCB_EXPORT RING_PREGENERATE_ASM
          cargo clippy -p talos-desktop --features desktop-ui --all-targets --locked -- -D warnings
          cargo test -p talos-desktop --features desktop-ui --locked

  remote-governance-reconciliation:
    name: Remote issue / owner reconciliation
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
