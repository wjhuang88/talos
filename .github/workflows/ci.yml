name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

env:
  CARGO_TERM_COLOR: always

jobs:
  i170-governance-sync:
    name: I170 derived governance sync
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/i170-windows-shell-portability-20260801'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact derived-view updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old in text:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
                  file.write_text(text.replace(old, new, 1), encoding="utf-8")
              elif new not in text:
                  raise SystemExit(f"{path}: neither old nor new form found: {old!r}")

          replace_once(
              "site/capabilities.html",
              """        <h3>Shell escape hatch</h3>
                  <ul>
                    <li><code>bash</code></li>
                  </ul>""".replace("          ", ""),
              """        <h3>Shell escape hatch</h3>
                  <ul>
                    <li><code>bash</code> &mdash; Unix, via <code>sh -c</code>.</li>
                    <li><code>powershell</code> &mdash; Windows, via <code>powershell.exe -NoProfile -NonInteractive</code>.</li>
                  </ul>""".replace("          ", ""),
          )
          replace_once(
              "site/zh/capabilities.html",
              """        <h3>Shell 兜底</h3>
                  <ul>
                    <li><code>bash</code></li>
                  </ul>""".replace("          ", ""),
              """        <h3>Shell 兜底</h3>
                  <ul>
                    <li><code>bash</code> &mdash; Unix，通过 <code>sh -c</code>。</li>
                    <li><code>powershell</code> &mdash; Windows，通过 <code>powershell.exe -NoProfile -NonInteractive</code>。</li>
                  </ul>""".replace("          ", ""),
          )

          iterations = Path("docs/iterations/README.md")
          text = iterations.read_text(encoding="utf-8")
          marker = "|----|----------|-------|----------------------------------|\n"
          row = "| I170 | Windows Workspace Validation Unblocker | Active — Draft PR #126 (2026-08-01) | PowerShell/absolute-timeout/portability implementation exists; exact-head Windows/macOS CI and security/maintainer acceptance remain pending. |\n"
          if row not in text:
              if text.count(marker) != 1:
                  raise SystemExit("iterations index header mismatch")
              text = text.replace(marker, marker + row, 1)
              iterations.write_text(text, encoding="utf-8")

          decisions = Path("docs/decisions/README.md")
          text = decisions.read_text(encoding="utf-8")
          marker = "- [055: Primary-Screen App-Owned Transcript With Native History Projection](055-primary-screen-app-owned-transcript-native-projection.md) — **Rejected** (2026-07-27). Short-lived one-mode primary-screen trial superseded by the maintainer-selected amended ADR-054 Alternate Screen renderer."
          addition = marker + "\n\n- [056: Transactional Steering Submission And Turn Ownership Boundary](056-transactional-steering-submission-boundary.md) — **Proposed / Review** (2026-08-01). Current TUI-044/I169 design for structured transactional steering; implementation remains blocked on merged I170.\n\n- [057: Windows PowerShell Process Boundary](057-windows-powershell-process-boundary.md) — **Proposed / Review** (2026-08-01). Draft PR #126 defines one authoritative platform shell contribution, child-local environment scrub, absolute direct-child timeout and explicit process-tree residuals."
          if "[057: Windows PowerShell Process Boundary]" not in text:
              if text.count(marker) != 1:
                  raise SystemExit("decisions index ADR-055 marker mismatch")
              decisions.write_text(text.replace(marker, addition, 1), encoding="utf-8")

          board = Path("docs/BOARD.md")
          text = board.read_text(encoding="utf-8")
          now_marker = "## Now\n\n| Item | State | Owner Doc | Gate |\n|---|---|---|---|\n"
          now_row = "| I170 Windows Shell And Portability Recovery | Active — Draft PR #126 (2026-08-01) | [I170](iterations/I170-windows-workspace-validation-unblocker.md) / [TOOL-023-A](backlog/active/TOOL-023-A-bash-timeout-fix.md) / [TOOL-023-C](backlog/active/TOOL-023-C-windows-powershell.md) / [ADR-057](decisions/057-windows-powershell-process-boundary.md) | Keep Draft until exact-head Windows/macOS tests, rebuilt platform evidence, security review and maintainer acceptance pass; never merge archival PR #121. |\n"
          if now_row not in text:
              if text.count(now_marker) != 1:
                  raise SystemExit("Board Now header mismatch")
              text = text.replace(now_marker, now_marker + now_row, 1)

          next_marker = "## Next\n\n| Item | State | Owner Doc | Gate |\n|---|---|---|---|\n"
          next_row = "| TUI-044 Transactional Batched Steering Recovery | Ready — claimed; blocked by I170 | [TUI-044](backlog/active/TUI-044-transactional-batched-steering-turn.md) / [I169](iterations/I169-batched-steering-turn.md) / [ADR-056](decisions/056-transactional-steering-submission-boundary.md) / [Issue #119](https://github.com/wjhuang88/talos/issues/119) | Activate only from the exact main containing merged I170; keep recovery PR #120 archival and I169 separate from Windows work. |\n"
          if next_row not in text:
              if text.count(next_marker) != 1:
                  raise SystemExit("Board Next header mismatch")
              text = text.replace(next_marker, next_marker + next_row, 1)
          text = text.replace("All 23 open Issues observed on 2026-08-01", "All 26 open Issues observed on 2026-08-01")
          board.write_text(text, encoding="utf-8")

          backlog = Path("docs/backlog/PRODUCT-BACKLOG.md")
          text = backlog.read_text(encoding="utf-8")
          marker = "| Priority | Focus | Why Now | Required Reads |\n| --- | --- | --- | --- |\n"
          rows = (
              "| 0 | I170 Windows shell and portability recovery | Draft PR #126 implements the still-missing PowerShell process boundary, absolute shell timeout and cross-platform fixtures on current main. Keep it isolated from I169 until exact-head Windows/macOS and security gates pass. | `docs/iterations/I170-windows-workspace-validation-unblocker.md`; `docs/backlog/active/TOOL-023-A-bash-timeout-fix.md`; `docs/backlog/active/TOOL-023-C-windows-powershell.md`; `docs/decisions/057-windows-powershell-process-boundary.md`; `docs/reference/I170-WINDOWS-SHELL-SECURITY-REVIEW-2026-08-01.md`; PR #126 |\n"
              "| 1 | TUI-044 transactional batched steering recovery | Issue #119 has a claimed current owner and Proposed ADR-056, but implementation remains blocked until I170 merges. Start only from the exact post-I170 main and keep archival PR #120 untouched. | `docs/backlog/active/TUI-044-transactional-batched-steering-turn.md`; `docs/iterations/I169-batched-steering-turn.md`; `docs/decisions/056-transactional-steering-submission-boundary.md`; Issue #119; recovery PR #120 |\n"
          )
          if "| 0 | I170 Windows shell and portability recovery |" not in text:
              if text.count(marker) != 1:
                  raise SystemExit("Product Backlog current-priority header mismatch")
              text = text.replace(marker, marker + rows, 1)
              backlog.write_text(text, encoding="utf-8")
          PY

          git diff --check

      - name: Commit derived-view sync
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No derived-view patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/capabilities.html site/zh/capabilities.html docs/iterations/README.md docs/decisions/README.md docs/BOARD.md docs/backlog/PRODUCT-BACKLOG.md
          git commit -m "docs(i170): synchronize derived views [i170-governance-sync]"
          git push origin HEAD:${{ github.head_ref }}

  preflight:
    name: Format + Check + Clippy + Test
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff whitespace validation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
          fi
          if [[ -z "${base_sha}" || "${base_sha}" == "${zero_sha}" ]]; then
            base_sha="HEAD^"
          fi
          git diff --check "${base_sha}...HEAD"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Release preflight
        run: ./scripts/release_preflight.sh

  windows-rust:
    name: Windows Rust workspace
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Clippy workspace
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Focused PowerShell process and timeout tests
        run: |
          cargo test -p talos-tools --locked platform_command_removes_dangerous_environment_variables -- --nocapture
          cargo test -p talos-tools --locked continuous_output_does_not_reset_timeout_deadline -- --nocapture
          cargo test -p talos-tools --locked test_shell_metacharacters_pipe -- --nocapture

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Validate project governance
        shell: pwsh
        run: ./scripts/validate_project_governance.ps1 .

      - name: Validate collaboration claims
        shell: bash
        run: ./scripts/validate_collaboration_claims.sh .

      - name: Rebuilt CLI mock smoke
        run: cargo run -p talos-cli --locked -- --mock --print --no-init --no-context "windows shell portability smoke"

  remote-governance-reconciliation:
    name: Remote issue / owner reconciliation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate open Issue ownership and synchronization comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_remote_issue_owners.py

  windows-installer-fixture:
    name: Windows installer fixture
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: PowerShell installer fixture (offline)
        shell: pwsh
        run: ./scripts/install_fixtures.ps1
