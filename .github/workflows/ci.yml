name: Issue Status Reconciliation Bridge

on:
  pull_request:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  apply-status-reconciliation:
    name: Apply issue status reconciliation
    if: github.head_ref == 'repair/issue-status-doc-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-issue-document-status
          fetch-depth: 0
          path: target

      - name: Reconstruct and apply validated document patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/wjhuang88/talos/issues/115/comments?per_page=100" \
            > /tmp/status-comments.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          prefix = "STATUS_PAYLOAD_V4_PART_"
          comments = json.loads(Path("/tmp/status-comments.json").read_text())
          parts = {}
          for comment in comments:
              body = comment.get("body") or ""
              if not body.startswith(prefix):
                  continue
              marker, payload = body.split("\n", 1)
              parts[marker.removeprefix(prefix)] = payload.strip()

          expected = ["00", "01", "02", "03", "04"]
          if sorted(parts) != expected:
              raise SystemExit(f"unexpected payload parts: {sorted(parts)}")
          Path("/tmp/status.patch.xz.b64").write_text(
              "".join(parts[key] for key in expected)
          )
          PY

          test "$(wc -c < /tmp/status.patch.xz.b64 | tr -d ' ')" -eq 31116
          base64 -d /tmp/status.patch.xz.b64 > /tmp/status.patch.xz
          echo '18c7cbd79867e47c9c7ff56ac29f63e6c0381b16f8d88a07f51f168a53e3da98  /tmp/status.patch.xz' | sha256sum -c -
          xz -dc /tmp/status.patch.xz > /tmp/status.patch
          echo '7a009b11c4ee0fad464859bf18c93a08c3e6b893c00d90a818176825d31f399f  /tmp/status.patch' | sha256sum -c -

          cd target
          test "$(git rev-parse HEAD)" = "92692ec8e839cec0658fb83f825b9e85487ce101"
          git apply --check /tmp/status.patch
          git apply /tmp/status.patch

          scripts/validate_project_governance.sh .
          bash scripts/validate_collaboration_claims.sh .

          git add -N docs
          git diff --check
          test "$(git diff --name-only | sed '/^docs\//d' | wc -l | tr -d ' ')" -eq 0
          test "$(git diff --name-only | wc -l | tr -d ' ')" -eq 24
          test "$(grep -c '^| \[#[0-9]' docs/reference/ISSUE-DOC-CODE-STATUS-2026-08-01.md)" -eq 23
          test "$(grep -R -l '| Claim State | Unclaimed |' docs/backlog/active/{DESKTOP-001,AGENT-003,RUNTIME-004,SESSION-009,ACP-001,RUNTIME-005,PERM-006,PERM-006-A,PERM-006-B,PERM-006-C,PERM-006-D,PERM-006-E,TUI-041,TUI-042,TUI-043,MEM-010,MEM-011}-*.md | sort -u | wc -l | tr -d ' ')" -eq 17

          git config user.name 'OpenAI Agent'
          git config user.email 'agent@openai.com'
          git add docs
          git diff --cached --check
          git commit -m 'docs(governance): reconcile open issue and owner status [model:gpt-5.6-thinking]'
          git push origin HEAD:agent/sync-issue-document-status
