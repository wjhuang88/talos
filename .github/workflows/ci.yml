name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  i158-symbol-test-repair:
    name: I158 symbol composition repair
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/i158-cli-symbol-contributions'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/i158-cli-symbol-contributions
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Isolate symbol composition path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/talos-cli/src/registry.rs")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)

          anchor = '''/// Builds the tool registry for print/inline/RPC modes.
'''
          helper = '''fn register_symbol_tool_contributions(
              registry: &mut ToolRegistry,
              workspace_root: PathBuf,
              wrap: impl Fn(Arc<dyn AgentTool>) -> Arc<dyn AgentTool>,
          ) {
              for contribution in symbol_tool_contributions(workspace_root) {
                  let contribution = contribution.map_tool(|tool| wrap(tool));
                  registry
                      .register_contribution(contribution)
                      .unwrap_or_else(|error| panic!("{error}"));
              }
          }

'''
          replace_once(anchor, helper + anchor)

          direct = '''    for contribution in symbol_tool_contributions(PathBuf::from(".")) {
              registry
                  .register_contribution(contribution)
                  .unwrap_or_else(|error| panic!("{error}"));
          }
'''
          direct_replacement = '''    register_symbol_tool_contributions(
              &mut registry,
              PathBuf::from("."),
              |tool| tool,
          );
'''
          count = text.count(direct)
          if count != 2:
              raise SystemExit(f"expected print and MCP symbol blocks, found {count}")
          text = text.replace(direct, direct_replacement)

          tui = '''    for contribution in symbol_tool_contributions(workspace_root.clone()) {
              let contribution = contribution.map_tool(|tool| {
                  Arc::new(TuiPermissionAwareTool {
                      inner: tool,
                      approval: approval_handler.clone(),
                  })
              });
              registry
                  .register_contribution(contribution)
                  .unwrap_or_else(|error| panic!("{error}"));
          }
'''
          tui_replacement = '''    register_symbol_tool_contributions(
              &mut registry,
              workspace_root.clone(),
              |tool| -> Arc<dyn AgentTool> {
                  Arc::new(TuiPermissionAwareTool {
                      inner: tool,
                      approval: approval_handler.clone(),
                  })
              },
          );
'''
          replace_once(tui, tui_replacement)

          old_test = '''    #[test]
              fn print_tui_and_mcp_registries_preserve_symbol_inventory_and_source() {
                  let print_registry = build_print_tool_registry(Vec::new());
                  let (tx, _rx) = mpsc::unbounded_channel();
                  let tui_registry = build_tui_tool_registry(
                      Arc::new(TuiApprovalHandler::new(tx, PathBuf::from("."))),
                      PathBuf::from("."),
                      Uuid::new_v4(),
                      Vec::new(),
                  );
                  let mcp_registry = build_mcp_tool_registry();
                  let names = [
                      "find_symbol",
                      "find_references",
                      "list_symbols",
                      "list_imports",
                  ];

                  for name in names {
                      assert!(print_registry.get(name).is_some(), "print missing {name}");
                      assert!(tui_registry.get(name).is_some(), "TUI missing {name}");
                      assert!(mcp_registry.get(name).is_some(), "MCP missing {name}");
                  }

                  for (mode, mut registry) in [
                      ("print", print_registry),
                      ("TUI", tui_registry),
                      ("MCP", mcp_registry),
                  ] {
                      let error = registry
                          .register_contribution(ToolContribution::new(
                              ToolContributionSource::new("test:duplicate"),
                              Arc::new(NamedReadTool {
                                  name: "find_symbol",
                                  description: "duplicate",
                              }),
                          ))
                          .unwrap_err();
                      assert_eq!(
                          error.to_string(),
                          "duplicate tool registration 'find_symbol': existing source 'talos-tools:symbol', incoming source 'test:duplicate'",
                          "{mode} source mismatch"
                      );
                  }
              }
'''
          new_test = '''    #[test]
              fn print_tui_and_mcp_registries_preserve_symbol_inventory_and_source() {
                  let mut print_registry = ToolRegistry::new();
                  register_symbol_tool_contributions(
                      &mut print_registry,
                      PathBuf::from("."),
                      |tool| tool,
                  );

                  let (tx, _rx) = mpsc::unbounded_channel();
                  let approval = Arc::new(TuiApprovalHandler::new(tx, PathBuf::from(".")));
                  let mut tui_registry = ToolRegistry::new();
                  register_symbol_tool_contributions(
                      &mut tui_registry,
                      PathBuf::from("."),
                      |tool| -> Arc<dyn AgentTool> {
                          Arc::new(TuiPermissionAwareTool {
                              inner: tool,
                              approval: approval.clone(),
                          })
                      },
                  );

                  let mut mcp_registry = ToolRegistry::new();
                  register_symbol_tool_contributions(
                      &mut mcp_registry,
                      PathBuf::from("."),
                      |tool| tool,
                  );

                  let names = [
                      "find_symbol",
                      "find_references",
                      "list_symbols",
                      "list_imports",
                  ];

                  for name in names {
                      assert!(print_registry.get(name).is_some(), "print missing {name}");
                      let tui_tool = tui_registry
                          .get(name)
                          .unwrap_or_else(|| panic!("TUI missing {name}"));
                      assert!(tui_tool.is_read_only(), "TUI wrapper changed {name} policy");
                      assert!(mcp_registry.get(name).is_some(), "MCP missing {name}");
                  }

                  for (mode, mut registry) in [
                      ("print", print_registry),
                      ("TUI", tui_registry),
                      ("MCP", mcp_registry),
                  ] {
                      let error = registry
                          .register_contribution(ToolContribution::new(
                              ToolContributionSource::new("test:duplicate"),
                              Arc::new(NamedReadTool {
                                  name: "find_symbol",
                                  description: "duplicate",
                              }),
                          ))
                          .unwrap_err();
                      assert_eq!(
                          error.to_string(),
                          "duplicate tool registration 'find_symbol': existing source 'talos-tools:symbol', incoming source 'test:duplicate'",
                          "{mode} source mismatch"
                      );
                  }
              }
'''
          replace_once(old_test, new_test)
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check

      - name: Validate focused scope
        run: |
          cargo test --locked -p talos-tools contributions::tests::symbol_group_has_stable_inventory_source_and_family
          cargo test --locked -p talos-cli registry::tests::print_tui_and_mcp_registries_preserve_symbol_inventory_and_source
          cargo clippy --locked -p talos-cli --bin talos -- -D warnings
          cargo fmt --all -- --check

      - name: Replace branch with one clean commit
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git reset --soft origin/main
          git add -A
          changed="$(git diff --cached --name-only)"
          test "$changed" = "crates/talos-cli/src/registry.rs" || {
            echo "unexpected staged files:"
            printf '%s\n' "$changed"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(cli): consume symbol tool contributions"
          git push --force origin HEAD:feature/i158-cli-symbol-contributions

  preflight:
    name: Format + Check + Clippy + Test
    if: github.head_ref != 'feature/i158-cli-symbol-contributions'
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Release preflight
        run: ./scripts/release_preflight.sh

  windows-installer-fixture:
    name: Windows installer fixture
    if: github.head_ref != 'feature/i158-cli-symbol-contributions'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: PowerShell installer fixture (offline)
        shell: pwsh
        run: ./scripts/install_fixtures.ps1
