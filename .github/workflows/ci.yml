name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

env:
  CARGO_TERM_COLOR: always

jobs:
  i170-one-shot-patch:
    name: I170 exact branch patch
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/i170-windows-shell-portability-20260801'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact platform-shell replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path("crates/talos-cli/src/registry.rs")
          text = registry.read_text(encoding="utf-8")
          if "const SHELL_TOOL_NAME: &str" not in text:
              insertion = "    use talos_tools::ReadImageTool;\n"
              constants = "\n    #[cfg(windows)]\n    const SHELL_TOOL_NAME: &str = \"powershell\";\n    #[cfg(not(windows))]\n    const SHELL_TOOL_NAME: &str = \"bash\";\n"
              if text.count(insertion) != 1:
                  raise SystemExit(f"unexpected ReadImageTool insertion count: {text.count(insertion)}")
              text = text.replace(insertion, insertion + constants, 1)

          replacements = [
              ('        let print_tui_inventory = vec![\n            "bash",\n', '        let print_tui_inventory = vec![\n            SHELL_TOOL_NAME,\n'),
              ('        let mcp_inventory = vec![\n            "bash",\n', '        let mcp_inventory = vec![\n            SHELL_TOOL_NAME,\n'),
              ('            ("talos-tools:shell", &["bash", "exec"][..]),', '            ("talos-tools:shell", &[SHELL_TOOL_NAME, "exec"][..]),'),
              ('                ("talos-tools:shell", "bash"),', '                ("talos-tools:shell", SHELL_TOOL_NAME),'),
          ]
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"unexpected replacement count {text.count(old)}: {old!r}")
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"neither old nor new registry form found: {old!r}")

          test_section = text.split("#[cfg(test)]\nmod tests {", 1)[1]
          unexpected = [
              line for line in test_section.splitlines()
              if '"bash"' in line and line != '    const SHELL_TOOL_NAME: &str = "bash";'
          ]
          if unexpected:
              raise SystemExit("unexpected hard-coded bash test literals:\n" + "\n".join(unexpected))
          registry.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = "- Process execution: `exec` (argv-only single process, no shell parsing), `bash` (shell escape hatch)"
          new = "- Process execution: `exec` (argv-only single process, no shell parsing), plus the permission-gated platform shell escape hatch: `bash` through `sh -c` on Unix and `powershell` through `powershell.exe -NoProfile -NonInteractive` on Windows"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("README platform shell line not found")
          readme.write_text(text, encoding="utf-8")

          readme_zh = Path("README.zh-CN.md")
          text = readme_zh.read_text(encoding="utf-8")
          old = "- Shell 兜底：`bash`"
          new = "- Shell 兜底：Unix 使用 `bash`（通过 `sh -c`），Windows 使用 `powershell`（通过 `powershell.exe -NoProfile -NonInteractive`）；两者都经过执行权限管线"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Chinese README platform shell line not found")
          readme_zh.write_text(text, encoding="utf-8")
          PY

          cargo fmt --all -- --check
          git diff --check

      - name: Commit exact branch patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/talos-cli/src/registry.rs README.md README.zh-CN.md
          git commit -m "fix(i170): align platform shell inventories [i170-auto-patch]"
          git push origin HEAD:${{ github.head_ref }}

  preflight:
    name: Format + Check + Clippy + Test
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff whitespace validation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
          else
            base_sha="${PUSH_BEFORE_SHA}"
          fi
          if [[ -z "${base_sha}" || "${base_sha}" == "${zero_sha}" ]]; then
            base_sha="HEAD^"
          fi
          git diff --check "${base_sha}...HEAD"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Release preflight
        run: ./scripts/release_preflight.sh

  windows-rust:
    name: Windows Rust workspace
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Clippy workspace
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Focused PowerShell process and timeout tests
        run: |
          cargo test -p talos-tools --locked platform_command_removes_dangerous_environment_variables -- --nocapture
          cargo test -p talos-tools --locked continuous_output_does_not_reset_timeout_deadline -- --nocapture
          cargo test -p talos-tools --locked test_shell_metacharacters_pipe -- --nocapture

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Validate project governance
        shell: pwsh
        run: ./scripts/validate_project_governance.ps1 .

      - name: Validate collaboration claims
        shell: bash
        run: ./scripts/validate_collaboration_claims.sh .

      - name: Rebuilt CLI mock smoke
        run: cargo run -p talos-cli --locked -- --mock --print --no-init --no-context "windows shell portability smoke"

  remote-governance-reconciliation:
    name: Remote issue / owner reconciliation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate open Issue ownership and synchronization comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_remote_issue_owners.py

  windows-installer-fixture:
    name: Windows installer fixture
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: PowerShell installer fixture (offline)
        shell: pwsh
        run: ./scripts/install_fixtures.ps1
