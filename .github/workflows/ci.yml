name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create marker
        shell: bash
        run: |
          mkdir -p probe
          printf 'head=%s\n' "${GITHUB_SHA}" > probe/marker.txt
      - uses: actions/upload-artifact@v4
        with:
          name: i169-trigger-probe
          path: probe/marker.txt
