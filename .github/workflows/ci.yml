name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  export-pr107-docs:
    name: Export PR 107 governance docs
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'repair/pr107-doc-export'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: pr107-governance-docs
          path: |
            docs/backlog/PRODUCT-BACKLOG.md
            docs/iterations/README.md
            docs/tasks/2026-07-26-v0.6-runtime-productization-program.md
            docs/tasks/2026-07-28-four-month-v06-execution-package.md
            docs/BOARD.md
          if-no-files-found: error
          retention-days: 1

  preflight:
    name: Format + Check + Clippy + Test
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Release preflight
        run: ./scripts/release_preflight.sh

  windows-installer-fixture:
    name: Windows installer fixture
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: PowerShell installer fixture (offline)
        shell: pwsh
        run: ./scripts/install_fixtures.ps1