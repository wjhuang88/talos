name: I169 fix mode runner test deadlock

on:
  pull_request:

concurrency:
  group: i169-fix-mode-runner-deadlock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/i169-tui-044-transactional-steering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Patch production-equivalent runtime fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/talos-cli/src/mode_runners_tests.rs')
          text = path.read_text()
          old = '''        let (sq_tx, _sq_rx) = mpsc::channel::<talos_core::session::SessionOp>(4);
                  let (sq_tx_watch_tx, _sq_rx_watch) = tokio::sync::watch::channel(sq_tx.clone());
                  let (bridge_tx, mut bridge_rx) = mpsc::unbounded_channel::<(
                      talos_session::Session,
                      mpsc::UnboundedReceiver<talos_core::session::SessionEvent>,
                  )>();
                  let transition = Arc::new(tokio::sync::Mutex::new(
                      SessionTransition::new(sq_tx, session.clone()).unwrap(),
                  ));
                  let mcp_config = talos_config::McpConfig::default();
          '''
          new = '''        let (sq_tx, mut sq_rx) = mpsc::channel::<talos_core::session::SessionOp>(4);
                  let (sq_tx_watch_tx, _sq_rx_watch) = tokio::sync::watch::channel(sq_tx.clone());
                  let (bridge_tx, mut bridge_rx) = mpsc::unbounded_channel::<(
                      talos_session::Session,
                      mpsc::UnboundedReceiver<talos_core::session::SessionEvent>,
                  )>();
                  let old_actor_join = tokio::spawn(async move {
                      while let Some(operation) = sq_rx.recv().await {
                          if matches!(operation, talos_core::session::SessionOp::Shutdown) {
                              break;
                          }
                      }
                  });
                  let scheduler_cancel = tokio_util::sync::CancellationToken::new();
                  let scheduler_token = scheduler_cancel.clone();
                  let scheduler_join = tokio::spawn(async move {
                      scheduler_token.cancelled().await;
                  });
                  let mut transition_owner =
                      SessionTransition::new(sq_tx, session.clone()).unwrap();
                  transition_owner
                      .attach_active_runtime(old_actor_join, scheduler_cancel, scheduler_join)
                      .unwrap();
                  let transition = Arc::new(tokio::sync::Mutex::new(transition_owner));
                  let mcp_config = talos_config::McpConfig::default();
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one success-fixture composition root, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_call = '''        let model_result = handle_session_model(
                      &transition,
                      &ui_tx,
                      &config,
                      &hooks,
                      workspace.path(),
                      &mcp_config,
                      &session_watch_tx,
                      &sq_tx_watch_tx,
                      &bridge_tx,
                      &session_watch_rx,
                      &session_manager,
                      "target-model".to_string(),
                      Some("target-gw".to_string()),
                      true,
                  )
                  .await;
          '''
          new_call = '''        let model_result = tokio::time::timeout(
                      std::time::Duration::from_secs(5),
                      handle_session_model(
                          &transition,
                          &ui_tx,
                          &config,
                          &hooks,
                          workspace.path(),
                          &mcp_config,
                          &session_watch_tx,
                          &sq_tx_watch_tx,
                          &bridge_tx,
                          &session_watch_rx,
                          &session_manager,
                          "target-model".to_string(),
                          Some("target-gw".to_string()),
                          true,
                      ),
                  )
                  .await
                  .expect("production-equivalent model switch must not hang");
          '''
          if text.count(old_call) != 1:
              raise SystemExit(f'expected one success model switch call, found {text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)
          path.write_text(text)
          PY
          rm .github/workflows/i169_fix_mode_runner_deadlock.yml
          cargo fmt --all
          git diff --check

      - name: Commit with exact-head protection
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_REF}"
          test "$(git rev-parse "origin/${HEAD_REF}")" = "${EXPECTED_HEAD}"
          git config user.name "talos-remediation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No test deadlock changes produced" >&2; exit 1; }
          git commit -m "test(cli): attach retired runtime in model switch fixture"
          git push origin "HEAD:${HEAD_REF}"
