name: ADR-053 Acceptance And I158 Activation

on:
  push:
    branches:
      - docs/adr053-accept-i158

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/adr053-accept-i158
          fetch-depth: 0
      - name: Apply architecture decision and activation record
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, pattern, replacement, label, flags=re.MULTILINE):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, got {count}")
              return updated

          adr_path = "docs/decisions/053-tool-registration-composition.md"
          text = read(adr_path)
          text = replace_once(text, r"^- Status: Proposed$", "- Status: Accepted", "ADR status")
          text = replace_once(text, r"^- Date: 2026-07-26$", "- Date: 2026-07-26\n- Accepted: 2026-07-31", "ADR accepted date")
          text = replace_once(
              text,
              r"^- Decision gate: MUST be accepted before I158 or production implementation$",
              "- Decision gate: Satisfied on 2026-07-31; I158 may activate under this contract",
              "ADR gate",
          )
          contract = r'''### Approved additive Rust contract

The first implementation uses an **instance contribution**, not a context-erasing service locator or a
factory trait in `talos-core`. Tool-owning crates expose ordinary, explicitly typed factory functions;
after the outer composition root supplies the required workspace/session/runtime values, each created
`Arc<dyn AgentTool>` is carried with a stable source identity:

```rust
#[derive(Debug, Clone, PartialEq, Eq, Hash, PartialOrd, Ord)]
pub struct ToolContributionSource(String);

impl ToolContributionSource {
    pub fn new(source: impl Into<String>) -> Self;
    pub fn as_str(&self) -> &str;
}

#[derive(Clone)]
pub struct ToolContribution {
    source: ToolContributionSource,
    tool: Arc<dyn AgentTool>,
}

impl ToolContribution {
    pub fn new(
        source: ToolContributionSource,
        tool: Arc<dyn AgentTool>,
    ) -> Self;

    pub fn source(&self) -> &ToolContributionSource;
    pub fn name(&self) -> &str;
    pub fn tool(&self) -> &Arc<dyn AgentTool>;

    pub fn map_tool(
        self,
        wrap: impl FnOnce(Arc<dyn AgentTool>) -> Arc<dyn AgentTool>,
    ) -> Self;
}

#[derive(Debug, Error, Clone, PartialEq, Eq)]
#[error(
    "duplicate tool registration '{tool_name}': existing source '{existing_source}', incoming source '{incoming_source}'"
)]
pub struct ToolRegistrationError {
    pub tool_name: String,
    pub existing_source: ToolContributionSource,
    pub incoming_source: ToolContributionSource,
}

impl ToolRegistry {
    pub fn register_contribution(
        &mut self,
        contribution: ToolContribution,
    ) -> Result<(), ToolRegistrationError>;
}
```

`register_contribution` is transactional for one contribution: on collision it returns the exact error
above and leaves the existing registry entry unchanged. Source strings are stable, display-safe
identifiers such as `talos-tools:file`, `talos-tools:git`, `talos-session:todo`,
`talos-cli:mcp-status`, or `plugin:<package>@<version>`; they contain no workspace path, arguments,
credentials, or dynamically projected tool input.

The existing `ToolRegistry::register` remains temporarily source-compatible and keeps its historical
replacement behavior during I158 migration. New product composition and plugin registration MUST use
`register_contribution`; after all equivalence tests pass, a later pre-1.0 cleanup may deprecate or
narrow the unchecked method with release-note guidance.

The concrete first owner modules are:

- `talos-core/src/tool.rs`: contribution/source/error contracts and checked registry insertion;
- `talos-tools/src/contributions.rs`: workspace, network, shell, Git, image, and code-intelligence
  factory groups with explicit typed arguments;
- `talos-session/src/tool_contributions.rs`: session-bound todo factory group;
- `talos-cli/src/registry.rs`: print/TUI/MCP profiles, runtime injection, permission adapters,
  capability selection, plugin loading, and final registry assembly.

Scheduler tools remain explicit caller-supplied contributions until their current construction owner
is consolidated separately. MCP `status` remains a CLI/MCP-product contribution. This keeps dependency
direction acyclic: core knows only `AgentTool`; tool/session crates depend on core; CLI depends on all
three; no implementation crate depends on CLI/TUI.

'''
          if "### Approved additive Rust contract" not in text:
              text = text.replace("### 1. Contract ownership\n", contract + "### 1. Contract ownership\n", 1)
          text = text.replace(
              "- `talos-agent`: runtime-owned tools such as todo/scheduler where applicable;",
              "- `talos-session`: session-bound todo tools; scheduler tools remain explicit caller-supplied contributions until their current owner is consolidated;",
          )
          matrix = r'''### 3.1 Behavior-equivalence matrix

I158 must preserve the following current product inventory and wrapper policy before deleting any old
builder. “Checked contribution” describes registration/collision handling only; it does not imply
permission approval.

| Contribution group | Print / inline / RPC | TUI | MCP | Wrapping and gating that must remain equivalent |
|---|---|---|---|---|
| Shell and direct exec | Included | Included | Included | Print uses blocking permission adapter with unresolved `Ask` denied; TUI uses channel-based approval; MCP keeps its current unwrapped registry behavior. |
| Snapshot-aware file tools | Included | Included | MCP keeps current ordinary file constructors | Existing workspace roots, exact external-path authorization, and mode-specific permission adapters remain unchanged. |
| Search, stat, diff, document extraction | Included | Included | Included | Preserve each current wrapper choice and workspace injection; no new permission default. |
| Code-intelligence tools | Included | Included | Included | Print/MCP and TUI wrapper differences are characterized and preserved until an explicit later permission change. |
| Git read and mutation tools | Included | Included | Included | Current read-tool versus mutation-tool wrapper selection remains byte-for-byte testable by tool name and behavior. |
| Network/web tools | Included | Included | Included | Existing permission profiles and wrapper selection remain unchanged. |
| `read_image` | Included in registry | Included in registry | Excluded | One authoritative `talos-tools` contribution; outer profile retains Supported-model presentation/capability gate and existing result projection/continuation behavior. |
| Todo tools | Ephemeral session-bound set | Durable current-session set | Excluded | Factory ownership moves to `talos-session`; current session IDs, storage roots, and permission wrapping remain unchanged. |
| Scheduler/delay tools | Explicit caller injection | Explicit caller injection | Excluded | Remain caller-supplied contributions; no global discovery. |
| MCP `status` | Excluded | Excluded | Included | CLI-owned MCP product contribution. |
| Explicit WASM plugins | Explicit package selection | Explicit package selection | Existing MCP behavior unchanged | Package loading stays explicit; checked registration reports built-in/plugin and plugin/plugin collisions with both source identities. |
| Presentation policy | Applied after executable registry construction | Applied after executable registry construction | Existing MCP exposure retained | A registered but unpresented tool remains non-executable to the model. |

Equivalence evidence must compare sorted tool-name sets for print, TUI, and MCP and exercise at least
one read-only tool plus one permission-gated tool through real product paths. Capability omission for
`read_image`, plugin collisions, duplicate built-ins, and composing the same profile twice are required
negative cases.

'''
          if "### 3.1 Behavior-equivalence matrix" not in text:
              text = text.replace("### 4. No hidden registration\n", matrix + "### 4. No hidden registration\n", 1)
          approval = r'''## Approval Record

Architecture/maintainer review on 2026-07-31 confirmed:

- the contract is additive and retains the old unchecked API only as a temporary compatibility seam;
- source identity and duplicate diagnostics are deterministic and redaction-safe;
- tool factories stay in their implementing crates while product policy stays in the outer root;
- print, TUI, MCP, plugin, session-tool, scheduler, and `read_image` equivalence cases are explicit;
- permission wrapping and model capability gating remain outer composition decisions;
- the initial implementation modules are named and introduce no dependency cycle;
- no global registration, service locator, event bus, or new composition crate is authorized.

ADR-053 is therefore Accepted and satisfies the activation gate for ARCH-034-R01/I158.

'''
          if "## Approval Record" not in text:
              text = text.replace("## Reversal Triggers\n", approval + "## Reversal Triggers\n", 1)
          write(adr_path, text)

          story_path = "docs/backlog/active/ARCH-034-R01-tool-registration-composition.md"
          text = read(story_path)
          text = replace_once(text, r"^\| Status \|.*$", "| Status | In Progress — I158 Active; ADR-053 Accepted 2026-07-31 |", "story status")
          text = replace_once(text, r"^\| Selected Iteration \|.*$", "| Selected Iteration | I158 (Active — ADR-053 accepted; baseline `43a63e30`) |", "story iteration")
          text = replace_once(
              text,
              r"## Readiness Gate\n.*?\n## Acceptance",
              """## Readiness Gate\n\nSatisfied on 2026-07-31. ADR-053 is Accepted and records the additive core API, migration path,\nfactory/composition ownership, exact duplicate diagnostic, explicit plugin/permission/capability\nboundaries, acyclic module ownership, and the print/TUI/MCP behavior-equivalence matrix. I158 is the\nsole Active implementation iteration and this Story is now In Progress.\n\n## Acceptance""",
              "story readiness block",
              flags=re.MULTILINE | re.DOTALL,
          )
          write(story_path, text)

          iteration_path = "docs/iterations/I158-tool-registration-composition.md"
          text = read(iteration_path)
          text = replace_once(text, r"^> Document status: Blocked$", "> Document status: Active", "iteration status")
          text = replace_once(
              text,
              r"\| `ARCH-034-R01` \| `ARCH-034` \| `Refinement/Blocked` \| `ADR-053` Accepted and ARCH-034-R01 updated to Ready \|",
              "| `ARCH-034-R01` | `ARCH-034` | `In Progress` | ADR-053 Accepted 2026-07-31; activation recorded against `43a63e30` |",
              "iteration selected story",
          )
          text = replace_once(
              text,
              r"\| YYYY-MM-DD \| Activation \| Record dependency inventory, baseline SHA, primary executor/runtime, and activation decision\. \|",
              "| 2026-07-31 | Activation | Baseline `43a63e30` (`main` after I168 merge). No other implementation iteration is Active or in Review. ADR-053 Accepted; ARCH-034-R01 moved to In Progress. Primary executor is GPT-5.6 Thinking through the connected GitHub repository workflow. Begin with the additive core contract and red tests; retain all old builders until equivalence evidence passes. |",
              "iteration activation row",
          )
          text = replace_once(text, r"^- Primary executor/runtime: pending$", "- Primary executor/runtime: GPT-5.6 Thinking through connected GitHub repository tooling", "executor")
          text = replace_once(text, r"^- External assistance: pending$", "- External assistance: none", "assistance")
          text = replace_once(text, r"^- Planning/editing/testing/docs/commit/push ownership: pending$", "- Planning/editing/testing/docs/commit/push ownership: primary executor; GitHub Actions supplies repository validation evidence", "ownership")
          text = replace_once(text, r"^- Qualification verdict: pending; do not assume qualification\.$", "- Qualification verdict: non-qualifying for REL-002 until Talos itself is the primary execution runtime", "qualification")
          write(iteration_path, text)

          board_path = "docs/BOARD.md"
          text = read(board_path)
          text = replace_once(
              text,
              r"^\| v0\.6 Runtime Productization Program \|.*$",
              "| v0.6 Runtime Productization Program | In Progress — ADR-053 accepted; I158 Active (2026-07-31) | [four-month package](tasks/2026-07-28-four-month-v06-execution-package.md) / [program](tasks/2026-07-26-v0.6-runtime-productization-program.md) / [ARCH-031](backlog/active/ARCH-031-crate-publication-boundary.md) / [ADR-053](decisions/053-tool-registration-composition.md) / [I158](iterations/I158-tool-registration-composition.md) | I158 is the sole Active implementation iteration. Deliver checked contribution contracts and print/TUI/MCP equivalence without changing permission defaults; I159-I162 remain blocked. |",
              "board program row",
          )
          write(board_path, text)

          backlog_path = "docs/backlog/PRODUCT-BACKLOG.md"
          text = read(backlog_path)
          text = replace_once(
              text,
              r"^\| ARCH-034-R01 \|.*$",
              "| ARCH-034-R01 | Tool Registration Composition Consolidation | In Progress — I158 Active; ADR-053 Accepted (2026-07-31) |",
              "product backlog row",
          )
          write(backlog_path, text)

          index_path = "docs/iterations/README.md"
          text = read(index_path)
          text = replace_once(
              text,
              r"^\| I158 \|.*$",
              "| I158 | **Active** (2026-07-31) | ARCH-034-R01. ADR-053 accepted; additive checked contributions and print/TUI/MCP registry-equivalence migration underway from baseline `43a63e30`. |",
              "iteration index row",
          )
          write(index_path, text)

          decisions_path = "docs/decisions/README.md"
          text = read(decisions_path)
          text = replace_once(
              text,
              r"^.*\[053:.*\]\(053-tool-registration-composition\.md\).*$",
              "- [053: Explicit Tool Registration Contributions And Product Composition](053-tool-registration-composition.md) — Accepted (2026-07-31). Adds checked instance contributions with stable source identity, deterministic duplicate diagnostics, explicit tool-crate factories, and outer-root print/TUI/MCP composition while preserving permissions and capability gates.",
              "decision index row",
          )
          write(decisions_path, text)
      - name: Validate governance changes
        shell: bash
        run: |
          git diff --check
          scripts/validate_project_governance.sh .
      - name: Commit activation
        shell: bash
        run: |
          rm .github/workflows/adr053-activation-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/decisions/053-tool-registration-composition.md \
            docs/decisions/README.md \
            docs/backlog/active/ARCH-034-R01-tool-registration-composition.md \
            docs/backlog/PRODUCT-BACKLOG.md \
            docs/iterations/I158-tool-registration-composition.md \
            docs/iterations/README.md \
            docs/BOARD.md \
            .github/workflows/adr053-activation-sync.yml
          git commit -m "docs(architecture): accept ADR-053 and activate I158"
          git push origin HEAD:docs/adr053-accept-i158
