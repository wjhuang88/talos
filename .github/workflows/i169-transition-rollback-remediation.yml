name: I169 transition rollback remediation

on:
  push:
    branches:
      - feat/i169-tui-044-transactional-steering

permissions:
  contents: write

concurrency:
  group: i169-transition-rollback-remediation
  cancel-in-progress: false

jobs:
  patch-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Apply reviewed rollback patch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 793662dfcdf64c8b4f2f9ac78890eb3173841e82 HEAD
          test -z "$(git diff --name-only 793662dfcdf64c8b4f2f9ac78890eb3173841e82 -- crates/talos-session crates/talos-cli)"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/i169_transition_rollback_patch.py')
          text = path.read_text()
          start = text.index("replace_once(\n    transition,\n    '''        let (session_watch_tx, _session_watch_rx)")
          end = text.index("old_assert = '''", start)
          replacement = '''text = transition.read_text()
          live_watch = "        let (session_watch_tx, _session_watch_rx) = watch::channel(new_session.clone());\\n"
          if text.count(live_watch) != 2:
              raise RuntimeError(f"expected two live publication watches, found {text.count(live_watch)}")
          text = text.replace(
              live_watch,
              "        let (session_watch_tx, session_watch_rx) = watch::channel(old_session.clone());\\n",
              2,
          )
          dropped_watch = "        let (session_watch_tx, session_watch_rx) = watch::channel(new_session.clone());\\n        drop(session_watch_rx);\\n"
          if text.count(dropped_watch) != 1:
              raise RuntimeError(f"expected one dropped publication watch, found {text.count(dropped_watch)}")
          text = text.replace(
              dropped_watch,
              "        let (session_watch_tx, session_watch_rx) = watch::channel(old_session.clone());\\n        drop(session_watch_rx);\\n",
              1,
          )
          transition.write_text(text)

          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
          python3 .github/i169_transition_rollback_patch.py
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('crates/talos-cli/src/session_transition.rs')
          text = path.read_text()
          ownership_pattern = re.compile(
              r'(\.publish_commit\(\s*\n\s*result,\s*\n\s*)new_session(,\s*\n\s*&session_watch_tx,)'
          )
          text, ownership_count = ownership_pattern.subn(
              r'\1new_session.clone()\2', text
          )
          if ownership_count != 3:
              raise SystemExit(
                  f"expected three publication test ownership calls, found {ownership_count}"
              )

          dropped_assertion_pattern = re.compile(
              r'(drop\(session_watch_rx\);\n(?:(?!\n\s*#\[tokio::test\]).)*?)'
              r'\s*assert_eq!\(session_watch_rx\.borrow\(\)\.id, old_session\.id\);\n',
              re.DOTALL,
          )
          text, dropped_assertion_count = dropped_assertion_pattern.subn(r'\1', text)
          if dropped_assertion_count != 1:
              raise SystemExit(
                  f"expected one dropped-watch assertion, found {dropped_assertion_count}"
              )

          old_error_assertion = '        assert!(error.contains("new generation is stopped"));\n'
          new_error_assertion = '''        assert!(error.contains("logical ownership was restored"));
          assert!(error.contains(&old_session.id.to_string()));
          assert!(error.contains(&new_session.id.to_string()));
          '''
          if text.count(old_error_assertion) != 3:
              raise SystemExit(
                  f"expected three legacy publication error assertions, found {text.count(old_error_assertion)}"
              )
          text = text.replace(old_error_assertion, new_error_assertion)
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
          if grep -En 'let _ = (talos_session::)?remove_session_artifacts_for_transcript|let _ = std::fs::remove_file\(&child_path\)' \
            crates/talos-cli/src/session_handlers.rs crates/talos-cli/src/session_setup.rs; then
            echo 'forbidden swallowed Session cleanup remains' >&2
            exit 1
          fi

      - name: Verify production rollback roots
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p talos-session --locked --test i169_session_artifact_cleanup --no-fail-fast
          cargo test -p talos-cli --locked session_transition::tests:: --no-fail-fast
          cargo test -p talos-cli --locked session_handlers::tests::rollback_ --no-fail-fast
          cargo test -p talos-cli --locked session_setup::fork_tests:: --no-fail-fast
          cargo clippy -p talos-session -p talos-cli --all-targets --locked -- -D warnings
          cargo check -p talos-cli --all-targets --locked

      - name: Publish clean verified rollback head
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/i169-transition-rollback-remediation.yml \
            .github/i169_transition_rollback_patch.py
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f -name 'i169-*' | wc -l)" -eq 0
          test ! -e .github/i169_transition_rollback_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- .github crates/talos-session crates/talos-cli
          git commit -m "fix(tui): roll back failed Session ownership"
          git push origin HEAD:feat/i169-tui-044-transactional-steering