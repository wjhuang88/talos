name: PR83 validator return patch

on:
  push:
    branches:
      - agent/agent-collaboration-governance

permissions:
  contents: write

jobs:
  patch-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agent-collaboration-governance
          fetch-depth: 0

      - name: Correct empty diff return
        shell: python
        run: |
          from pathlib import Path

          script = Path("scripts/validate_collaboration_claims.sh")
          text = script.read_text(encoding="utf-8")
          old = '  [[ -n "$changed" ]] || return\n'
          new = '  [[ -n "$changed" ]] || return 0\n'
          if text.count(old) != 1:
              raise SystemExit("expected validator return statement not found exactly once")
          script.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/pr83-validator-return-patch.yml").unlink()

      - name: Commit validator correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate_collaboration_claims.sh .github/workflows/pr83-validator-return-patch.yml
          git commit -m "fix(governance): accept empty owner diff [model:gpt-5.6-thinking]"
          git push origin HEAD:agent/agent-collaboration-governance
