name: I169 strict Clippy cleanup 2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/i169-clippy-cleanup2.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.number == 131
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Replace strict test lint violations
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path("crates/talos-dashboard/src/lib.rs"),
              Path("crates/talos-provider/src/image_io.rs"),
              Path("crates/talos-provider/src/openai_request.rs"),
              Path("crates/talos-provider/src/openai_sse.rs"),
              Path("crates/talos-provider/src/anthropic_request.rs"),
          ]

          for path in files:
              text = path.read_text()
              marker = "#[cfg(test)]"
              marker_at = text.find(marker)
              if marker_at < 0:
                  raise SystemExit(f"missing test-module marker in {path}")
              production = text[:marker_at]
              tests = text[marker_at:]
              tests = tests.replace(
                  ".unwrap_err()",
                  '.expect_err("expected test operation to fail")',
              )
              tests = tests.replace(
                  ".unwrap()",
                  '.expect("test operation should succeed")',
              )
              if path.name == "openai_request.rs":
                  tests = tests.replace(
                      "std::fs::write(&img_path, &png_header)",
                      "std::fs::write(&img_path, png_header)",
                  )
              path.write_text(production + tests)

      - name: Format workspace
        run: cargo fmt --all

      - name: Strict workspace Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Publish source-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/talos-dashboard/src/lib.rs \
            crates/talos-provider/src/image_io.rs \
            crates/talos-provider/src/openai_request.rs \
            crates/talos-provider/src/openai_sse.rs \
            crates/talos-provider/src/anthropic_request.rs
          if git diff --cached --quiet; then
            echo "No source cleanup changes to publish"
            exit 0
          fi
          git commit -m "test(clippy): clarify dashboard and provider failures"
          git push origin HEAD:feat/i169-tui-044-transactional-steering

      - name: Propagate Clippy result
        if: steps.clippy.outcome == 'failure'
        run: exit 1
