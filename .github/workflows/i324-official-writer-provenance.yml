name: I324 official writer provenance oracle
on:
  pull_request:
    paths:
      - 'scripts/probe_i324_official_writer_profile.ps1'
      - '.github/workflows/i324-official-writer-provenance.yml'
      - 'docs/proposals/i324-official-writer-provenance.md'
permissions:
  contents: read
jobs:
  oracle:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        package: [MinGit, PortableGit]
    steps:
      - uses: actions/checkout@v4
      - name: Observe official package source semantics
        shell: pwsh
        run: ./scripts/probe_i324_official_writer_profile.ps1 -Package ${{ matrix.package }}
