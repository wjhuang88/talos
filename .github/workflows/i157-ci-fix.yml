name: I157 CI Fix

on:
  push:
    branches:
      - fix/i157-finalization-durability

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/i157-finalization-durability
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply compile fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/talos-config/src/store/recovery.rs")
          text = path.read_text()
          old = '''            let file_name = entry.file_name();
            let Some(name) = file_name.to_str() else {
                continue;
            };
'''
          new = '''            let Some(file_name) = entry.file_name() else {
                continue;
            };
            let Some(name) = file_name.to_str() else {
                continue;
            };
'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected two file_name blocks, found {count}")
          path.write_text(text.replace(old, new))
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          git rm .github/workflows/i157-ci-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/talos-config/src/store.rs crates/talos-config/src/store/recovery.rs
          git commit -m "fix(config): correct finalization residue path handling"
          git push origin HEAD:fix/i157-finalization-durability
