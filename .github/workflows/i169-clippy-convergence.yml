name: I169 strict Clippy convergence gate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/i169-clippy-convergence.yml
      - .github/i169-clippy-convergence.py

permissions:
  contents: write

jobs:
  converge-verify-and-publish:
    if: github.event.pull_request.number == 131
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/i169-tui-044-transactional-steering
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Apply reviewed remediation
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RUBY'
          workflow = YAML.load_file('.github/workflows/i169-source-verify2.yml')
          step = workflow.fetch('jobs').fetch('verify-and-publish').fetch('steps').find do |candidate|
            candidate['name'] == 'Apply reviewed remediation'
          end
          abort('reviewed remediation step not found') unless step && step['run']
          File.write('/tmp/i169-apply-reviewed-remediation.sh', "#!/usr/bin/env bash\nset -eo pipefail\n#{step.fetch('run')}\n")
          RUBY
          bash /tmp/i169-apply-reviewed-remediation.sh

      - name: Apply mechanical Clippy convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/i169-clippy-convergence.py')
          text = path.read_text()
          start = text.index('# Remove the superseded non-activation quiesce path.')
          end = text.index('# Remove construction state that is no longer consumed', start)
          replacement = '''# Keep the legacy marker compatibility boundary test-only. Production model\n# activation uses quiesce_same_session_for_activation exclusively.\npath = Path("crates/talos-cli/src/session_transition.rs")\ntext = path.read_text()\nneedle = "    pub async fn quiesce_same_session("\nif "    #[cfg(test)]\\n" + needle not in text:\n    if needle not in text:\n        raise RuntimeError("quiesce_same_session compatibility boundary not found")\n    text = text.replace(needle, "    #[cfg(test)]\\n" + needle, 1)\npath.write_text(text)\n\n'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          python3 .github/i169-clippy-convergence.py
          python3 - <<'PY'
          from pathlib import Path

          for filename in [
              'crates/talos-conversation/src/governance_summary.rs',
              'crates/talos-plugin/src/manifest.rs',
              'crates/talos-plugin/src/wasm.rs',
          ]:
              path = Path(filename)
              text = path.read_text()
              marker = text.find('#[cfg(test)]')
              if marker < 0:
                  raise RuntimeError(f'test module marker not found in {filename}')
              prefix, tests = text[:marker], text[marker:]
              tests = tests.replace(
                  '.unwrap_err()',
                  '.expect_err("operation should fail")',
              )
              tests = tests.replace(
                  '.unwrap()',
                  '.expect("operation should succeed")',
              )
              path.write_text(prefix + tests)
          PY
          set +e
          cargo clippy --fix --workspace --all-targets --locked --allow-dirty --allow-staged -- -D warnings
          fix_status=$?
          set -e
          echo "cargo clippy --fix completed with status ${fix_status}; residual diagnostics are checked below"
          cargo fmt --all
          git add -A
          cargo fmt --all -- --check
          git diff --cached --check

      - name: Workspace compile
        run: cargo check --workspace --locked

      - name: Agent request-budget regression tests
        run: |
          cargo test -p talos-agent configured_output_limit_above_4096_is_reserved_before_dispatch --locked
          cargo test -p talos-agent declared_image_size_is_conservatively_budgeted_before_dispatch --locked
          cargo test -p talos-agent multiple_declared_images_saturate_budget_instead_of_overflowing --locked

      - name: Session runtime-identity regression tests
        run: |
          cargo test -p talos-session --test i169_runtime_identity --locked
          cargo test -p talos-session runtime_activation_stage_is_generation_atomic_and_restart_recoverable --locked

      - name: CLI publication and compaction regression tests
        id: cli_regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo test -p talos-cli publication_failure_stops_replacement_without_success --locked -- --nocapture 2>&1 | tee /tmp/i169-publication-failure.log || status=1
          cargo test -p talos-cli session_owned_activation_survives_repeated_production_compaction --locked -- --nocapture 2>&1 | tee /tmp/i169-compaction.log || status=1
          exit "$status"

      - name: Upload CLI regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i169-cli-regression-diagnostics
          path: |
            /tmp/i169-publication-failure.log
            /tmp/i169-compaction.log
          if-no-files-found: error

      - name: Propagate CLI regression result
        if: steps.cli_regression.outcome == 'failure'
        run: exit 1

      - name: Source-layout boundary tests
        run: cargo test -p talos-cli --test i169_source_layout --locked

      - name: Full talos-cli test suite
        run: cargo test -p talos-cli --locked

      - name: Strict workspace Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee /tmp/i169-strict-clippy.log

      - name: Upload strict Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i169-strict-clippy-convergence-diagnostics
          path: /tmp/i169-strict-clippy.log
          if-no-files-found: error

      - name: Publish fully verified remediation
        if: steps.clippy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          find .github -maxdepth 1 -type f -name 'i169-followup*.patch.gz.b64*' -print0 | xargs -0 -r git rm -f --
          git rm -f .github/i169-clippy-convergence.py
          git diff --cached --check
          git config user.name talos-governance-bot
          git config user.email actions@users.noreply.github.com
          git commit -m "fix(i169): harden session runtime reconstruction"
          git push origin HEAD:feat/i169-tui-044-transactional-steering

      - name: Propagate strict Clippy result
        if: steps.clippy.outcome == 'failure'
        run: exit 1
