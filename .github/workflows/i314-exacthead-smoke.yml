name: I314 exact-head smoke
on:
  push:
    branches:
      - tmp/i314-exacthead-smoke-20261104
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Workspace Clippy
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Config tests
        run: cargo test -p talos-config --locked --lib
      - name: Compile actual CLI
        run: cargo build -p talos-cli --locked
      - name: Explicit search real-binary acceptance
        run: |
          python3 -m py_compile scripts/accept_search_overrides.py
          python3 scripts/accept_search_overrides.py target/debug/talos
