[workspace]
resolver = "3"
members = ["languages/guest", "languages/rust", "languages/python", "package"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
talos-language-guest = { path = "languages/guest" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 0
incremental = false
